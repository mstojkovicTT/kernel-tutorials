<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circular Buffer Dojo</title>
<meta name="description" content="Interactive walkthrough of tt-metal circular buffers — cb_reserve_back, cb_push_back, cb_wait_front, cb_pop_front — simulated live through the kernel dojo exercises.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥋</text></svg>">
</head>
<body>
<style>
/* ---------- tokens: dark-first (deliberate), light overrides both ways ---------- */
:root{
  --bg:#0e1118; --panel:#151a24; --panel2:#1b2230; --code-bg:#10141d;
  --line:#2a3245; --text:#e6eaf3; --muted:#8f97ab; --faint:#5b647a;
  --teal:#45c8bb; --amber:#e8a84c; --violet:#9d7bf5; --red:#ef6b6b; --green:#5bc17e;
  --hl:#233048; --hl-blk:#3d2330;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f3f7; --panel:#ffffff; --panel2:#e9ebf3; --code-bg:#f6f7fb;
    --line:#d4d8e4; --text:#20263a; --muted:#5d6579; --faint:#8b92a6;
    --teal:#0d8f82; --amber:#a86f10; --violet:#6b46d8; --red:#c04545; --green:#2e8f57;
    --hl:#dfe7f5; --hl-blk:#f6dcdc;
  }
}
:root[data-theme="light"]{
  --bg:#f2f3f7; --panel:#ffffff; --panel2:#e9ebf3; --code-bg:#f6f7fb;
  --line:#d4d8e4; --text:#20263a; --muted:#5d6579; --faint:#8b92a6;
  --teal:#0d8f82; --amber:#a86f10; --violet:#6b46d8; --red:#c04545; --green:#2e8f57;
  --hl:#dfe7f5; --hl-blk:#f6dcdc;
}
:root[data-theme="dark"]{
  --bg:#0e1118; --panel:#151a24; --panel2:#1b2230; --code-bg:#10141d;
  --line:#2a3245; --text:#e6eaf3; --muted:#8f97ab; --faint:#5b647a;
  --teal:#45c8bb; --amber:#e8a84c; --violet:#9d7bf5; --red:#ef6b6b; --green:#5bc17e;
  --hl:#233048; --hl-blk:#3d2330;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.55;overflow:hidden}
h1,h2,h3{font-family:var(--mono);letter-spacing:-.02em;text-wrap:balance;margin:0}
code,pre,kbd,.mono{font-family:var(--mono)}
button{font-family:var(--mono);cursor:pointer}
a{color:var(--teal)}

#deck{height:calc(100% - 52px);position:relative}
.slide{display:none;height:100%;overflow-y:auto;overflow-x:hidden}
.slide.active{display:block;animation:fadein .28s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .slide.active{animation:none}
  .dot-anim,.pg-filling,.noclink.on{animation:none !important}
}
.wrap{max-width:1280px;margin:0 auto;padding:28px 40px 40px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.eyebrow b{color:var(--teal);font-weight:600}
h2{font-size:26px;margin-bottom:6px}
.lede{color:var(--muted);max-width:68ch;margin:4px 0 20px}
.lede code{color:var(--text);font-size:.92em}
.src-note{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:18px}

/* ---------- deck bar ---------- */
#deckbar{height:52px;border-top:1px solid var(--line);background:var(--panel);
  display:flex;align-items:center;gap:14px;padding:0 20px}
#deckbar .title{font-family:var(--mono);font-size:12px;color:var(--muted);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#deckbar .dots{display:flex;gap:8px}
#deckbar .dots button{width:10px;height:10px;border-radius:50%;border:1px solid var(--faint);
  background:transparent;padding:0}
#deckbar .dots button.on{background:var(--teal);border-color:var(--teal)}
#deckbar .dots button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.navbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:6px;padding:6px 14px;font-size:13px}
.navbtn:hover{border-color:var(--teal)}
.navbtn:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
#pgnum{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:44px;text-align:center}

/* ---------- title slide ---------- */
.hero{display:flex;flex-direction:column;justify-content:center;min-height:82%;max-width:1100px;margin:0 auto;padding:40px}
.hero h1{font-size:clamp(38px,6vw,68px);line-height:1.06;font-weight:700}
.hero h1 .dim{color:var(--faint)}
.hero .sub{font-size:17px;color:var(--muted);max-width:62ch;margin-top:18px}
.hero .ringrow{margin:34px 0 8px}
.hero .hint{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:30px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;font-size:11px;background:var(--panel)}
.api-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.api-chips code{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:12.5px}
.api-chips .c-t{color:var(--teal)} .api-chips .c-a{color:var(--amber)}

/* ---------- pipeline diagram (slide 2) ---------- */
.pipe{display:flex;align-items:stretch;gap:0;margin:26px 0 8px;min-width:980px}
.pipewrap{overflow-x:auto;padding-bottom:8px}
.pnode{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;text-align:center;min-width:108px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.pnode .nm{font-family:var(--mono);font-size:13px;font-weight:600}
.pnode .ds{font-size:11px;color:var(--muted)}
.pnode.dram{border-color:var(--faint)}
.pnode.reader .nm{color:var(--teal)} .pnode.writer .nm{color:var(--amber)} .pnode.compute .nm{color:var(--violet)}
.core{border:1.5px dashed var(--faint);border-radius:14px;padding:26px 16px 10px;position:relative;
  display:flex;align-items:stretch;gap:0;margin:0 6px}
.core::before{content:"one Tensix core · L1 SRAM 1.4 MB · 5 RISC-V processors";
  position:absolute;top:6px;left:16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint)}
.flow{display:flex;flex-direction:column;justify-content:center;align-items:center;
  min-width:86px;position:relative;gap:2px;padding:0 4px}
.flow .lbl{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.flow .lbl.t{color:var(--teal)} .flow .lbl.a{color:var(--amber)}
.flow .track{width:100%;height:2px;background:var(--line);position:relative;margin:6px 0;border-radius:2px}
.flow .track .dot-anim{position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;
  background:var(--teal);animation:flowdot 2.4s linear infinite}
.flow .track .dot-anim.d2{animation-delay:1.2s}
.flow.out .dot-anim{background:var(--amber)}
.flow.vio .dot-anim{background:var(--violet)}
@keyframes flowdot{from{left:-4%;opacity:0}12%{opacity:1}88%{opacity:1}to{left:98%;opacity:0}}
.cbnode{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:88px}
.cbnode svg{display:block}
.cbnode .nm{font-family:var(--mono);font-size:11px;color:var(--muted)}
.dstchip{margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--violet);
  border:1px solid var(--violet);border-radius:5px;padding:2px 7px}
.legend2{display:flex;gap:26px;flex-wrap:wrap;margin-top:20px;font-size:13px;color:var(--muted)}
.legend2 b{font-family:var(--mono);font-weight:600;color:var(--text)}
.legend2 .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}

/* ---------- generic panels ---------- */
.panelbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
table.opstable{border-collapse:collapse;width:100%;font-size:14px}
table.opstable th,table.opstable td{border:1px solid var(--line);padding:9px 14px;text-align:left}
table.opstable th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--panel2)}
table.opstable code{font-size:13px}
.t{color:var(--teal)} .a{color:var(--amber)} .v{color:var(--violet)} .r{color:var(--red)} .g{color:var(--green)}

/* ---------- sim layout ---------- */
.simbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 16px}
.simbar .sp{flex:1}
.ctl{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;
  padding:7px 16px;font-size:13px}
.ctl:hover{border-color:var(--teal)}
.ctl:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.ctl.primary{background:var(--teal);color:var(--bg);border-color:var(--teal);font-weight:700}
.tickbox{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tickbox b{color:var(--text)}
.optgrp{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.optgrp button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:5px 11px;font-size:12px}
.optgrp button.on{border-color:var(--teal);color:var(--teal);background:color-mix(in srgb,var(--teal) 10%,transparent)}
.hangbar{display:none;background:color-mix(in srgb,var(--red) 14%,var(--panel));border:1px solid var(--red);
  color:var(--text);border-radius:8px;padding:10px 16px;font-size:13.5px;margin:0 0 14px}
.hangbar.on{display:block}
.hangbar b{color:var(--red);font-family:var(--mono)}
.donebar{display:none;background:color-mix(in srgb,var(--green) 12%,var(--panel));border:1px solid var(--green);
  border-radius:8px;padding:10px 16px;font-size:13.5px;margin:0 0 14px}
.donebar.on{display:block}

.simgrid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1.08fr) minmax(300px,1fr);gap:18px;align-items:start}
.simgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:start}
@media (max-width:1000px){.simgrid,.simgrid3{grid-template-columns:1fr}}

.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pane-hd{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.pane-hd .kname{font-family:var(--mono);font-size:12.5px;font-weight:600}
.proc{font-family:var(--mono);font-size:10px;letter-spacing:.08em;border-radius:4px;padding:2px 7px;border:1px solid}
.proc-teal{color:var(--teal);border-color:var(--teal)}
.proc-amber{color:var(--amber);border-color:var(--amber)}
.proc-violet{color:var(--violet);border-color:var(--violet)}
pre.code{margin:0;padding:10px 0;background:var(--code-bg);font-size:12.3px;line-height:1.62;overflow-x:auto}
.cl{padding:0 14px;white-space:pre}
.cl-cur{background:var(--hl);box-shadow:inset 3px 0 0 var(--teal)}
.pane.amberside .cl-cur{box-shadow:inset 3px 0 0 var(--amber)}
.pane.violetside .cl-cur{box-shadow:inset 3px 0 0 var(--violet)}
.cl-blk{background:var(--hl-blk);box-shadow:inset 3px 0 0 var(--red)}
.pane-ft{padding:7px 12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;min-height:34px}
.st-run{color:var(--muted)} .st-done{color:var(--green)} .st-blk{color:var(--red)}

/* ---------- CB ring & strips ---------- */
.vizcol{display:flex;flex-direction:column;align-items:center;gap:10px}
.vizcol .cbcap{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.vizcol .cbcap b{color:var(--text)}
svg.ring{overflow:visible}
.pg{stroke-width:1.5}
.pg-free{fill:var(--panel2);stroke:var(--line)}
.pg-reserved{fill:color-mix(in srgb,var(--teal) 14%,transparent);stroke:var(--teal);stroke-dasharray:4 3}
.pg-filling{fill:color-mix(in srgb,var(--teal) 45%,transparent);stroke:var(--teal);animation:pgpulse 1s ease-in-out infinite}
.pg-full{fill:color-mix(in srgb,var(--teal) 65%,transparent);stroke:var(--teal);stroke-dasharray:4 3}
.pg-ready{fill:var(--teal);stroke:var(--teal)}
.pg-draining{fill:var(--amber);stroke:var(--amber);animation:pgpulse 1s ease-in-out infinite}
.ring.vio .pg-reserved{fill:color-mix(in srgb,var(--violet) 14%,transparent);stroke:var(--violet)}
.ring.vio .pg-filling,.ring.vio .pg-full{fill:color-mix(in srgb,var(--violet) 55%,transparent);stroke:var(--violet)}
.ring.vio .pg-ready{fill:var(--violet);stroke:var(--violet)}
@keyframes pgpulse{50%{opacity:.55}}
.pgt{font-family:var(--mono);font-size:13px;font-weight:700;fill:var(--bg);text-anchor:middle;dominant-baseline:central}
.pg-reserved-t,.pg-free-t{fill:var(--muted)}
.ctr-n{font-family:var(--mono);font-size:20px;font-weight:700;fill:var(--text);text-anchor:middle}
.ctr-l{font-family:var(--mono);font-size:9px;letter-spacing:.1em;fill:var(--muted);text-anchor:middle;text-transform:uppercase}
.ptr{font-family:var(--mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.ptr-rd{fill:var(--amber)} .ptr-wr{fill:var(--teal)}
.ptrline{stroke-width:1.5;fill:none}
.ptrline-rd{stroke:var(--amber)} .ptrline-wr{stroke:var(--teal)}

.strip{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.striplbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:center;margin-bottom:5px}
.tile{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--faint);background:var(--panel2)}
.t-idle{}
.t-reading{border-color:var(--teal);color:var(--teal);animation:pgpulse 1s infinite}
.t-read{background:color-mix(in srgb,var(--teal) 22%,var(--panel2));border-color:var(--teal);color:var(--text)}
.t-empty{border-style:dashed}
.t-writing{border-color:var(--amber);color:var(--amber);animation:pgpulse 1s infinite}
.t-written{background:var(--amber);border-color:var(--amber);color:var(--bg)}
.t-written.vio{background:var(--violet);border-color:var(--violet)}
.t-wrong{background:color-mix(in srgb,var(--red) 30%,var(--panel2));border-color:var(--red);color:var(--red)}
.noclink{font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px dashed var(--line);
  border-radius:5px;padding:2px 10px;letter-spacing:.12em}
.noclink.on{color:var(--teal);border-color:var(--teal)}
.noclink.on.amb{color:var(--amber);border-color:var(--amber)}
@keyframes nocblink{50%{opacity:.4}}
.noclink.on{animation:nocblink .8s infinite}
.cbtotals{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cbtotals b{color:var(--text)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--muted);justify-content:center}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}

/* DST register strip */
.dstbox{display:flex;flex-direction:column;align-items:center;gap:7px}
.dstslots{display:flex;gap:4px}
.dsts{width:26px;height:26px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--faint)}
.dsts.on{background:var(--violet);border-color:var(--violet);color:var(--bg);font-weight:700}
.holder{font-family:var(--mono);font-size:10.5px;border-radius:99px;padding:3px 12px;border:1px solid var(--line);color:var(--muted)}
.holder.math{color:var(--violet);border-color:var(--violet)}
.holder.committed{color:var(--teal);border-color:var(--teal)}
.holder.pack{color:var(--amber);border-color:var(--amber)}

/* pitfall tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.tabs button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 16px;font-size:12.5px}
.tabs button.on{border-color:var(--red);color:var(--red);background:color-mix(in srgb,var(--red) 8%,transparent)}
.tabpane{display:none}.tabpane.on{display:block}

/* slide 3 demo */
.demo3{display:grid;grid-template-columns:minmax(300px,1fr) minmax(340px,1fr);gap:30px;align-items:center;margin-top:10px}
@media (max-width:900px){.demo3{grid-template-columns:1fr}}
.demo3 .facts{display:flex;flex-direction:column;gap:12px}
.factrow{display:flex;gap:12px;align-items:baseline}
.factrow .k{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:150px}
.factrow .v2{font-family:var(--mono);font-size:14px;font-weight:600}
.demomsg{font-family:var(--mono);font-size:12.5px;min-height:44px;border:1px solid var(--line);
  border-radius:8px;padding:9px 13px;background:var(--code-bg);color:var(--muted)}
.demomsg.blk{border-color:var(--red);color:var(--red)}
.demomsg.ok{border-color:var(--line);color:var(--text)}
.bigbtn{padding:10px 20px;font-size:13.5px;border-radius:8px;border:1px solid;background:transparent}
.bigbtn.push{color:var(--teal);border-color:var(--teal)}
.bigbtn.push:hover{background:color-mix(in srgb,var(--teal) 12%,transparent)}
.bigbtn.pop{color:var(--amber);border-color:var(--amber)}
.bigbtn.pop:hover{background:color-mix(in srgb,var(--amber) 12%,transparent)}

blockquote.rule{border-left:3px solid var(--teal);margin:18px 0;padding:10px 20px;background:var(--panel);
  border-radius:0 8px 8px 0;font-size:16px;max-width:72ch}
blockquote.rule b{color:var(--teal)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:18px}
@media (max-width:900px){.twocol{grid-template-columns:1fr}}
.gonext{font-family:var(--mono);font-size:13px;background:var(--code-bg);border:1px solid var(--line);
  border-radius:8px;padding:14px 18px;line-height:2}
.gonext .c{color:var(--faint)}

/* ---------- journey (where everything lives) ---------- */
.jrscene{display:flex;align-items:stretch;gap:0;min-width:960px;margin-top:6px}
.jrmem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  display:flex;flex-direction:column;gap:10px;height:100%}
.jrmem>.jrhd{font-family:var(--mono);font-size:12.5px;font-weight:700}
.jrmem>.jrsub{font-size:11px;color:var(--muted);margin-top:-6px;max-width:24ch}
.jrcore{border:1.5px dashed var(--faint);border-radius:16px;padding:24px 14px 12px;position:relative;
  display:flex;align-items:stretch;gap:0;margin-left:4px}
.jrcore::before{content:"one Tensix core";position:absolute;top:5px;left:16px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.jrgap{display:flex;flex-direction:column;justify-content:space-around;gap:14px;padding:0 6px;min-width:128px}
.jrhop{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:center;line-height:1.5;
  border:1px dashed transparent;border-radius:8px;padding:6px 4px;transition:color .2s}
.jrhop code{font-size:10px;color:inherit}
.jrhop.on{color:var(--teal);border-color:var(--teal);animation:nocblink .9s infinite}
.jrhop.on.amb{color:var(--amber);border-color:var(--amber)}
.jrhop.on.vio{color:var(--violet);border-color:var(--violet)}
.jrstation{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--panel2);
  display:flex;align-items:center;gap:8px;min-height:40px;transition:box-shadow .2s,border-color .2s}
.jrstation .jrsl{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.jrstation .slot{min-width:26px;min-height:26px;display:flex;gap:4px}
.jrstation.on{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 22%,transparent)}
.jrstation.on.vio{border-color:var(--violet);box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 22%,transparent)}

{t:"Circular Buffers", h:`
<div class="hero">

  <h1>Circular<br>Buffers<span class="dim">.</span></h1>
  <p class="sub">The queues that connect your kernels. Everything hangs off understanding
  these properly — <em>including most of your bugs</em>. Seven slides of this deck are live and
  interactive: follow a tile through the memory hierarchy, then step the real dojo exercise
  kernels — race them, deadlock them.</p>
  <div class="api-chips">
    <code class="c-t">cb_reserve_back()</code><code class="c-t">cb_push_back()</code>
    <code class="c-a">cb_wait_front()</code><code class="c-a">cb_pop_front()</code>

{t:"The stack — one Tensix core", h:`
<div class="wrap">
  <p class="eyebrow">02 · where a CB sits</p>
  <h2>The stack: DRAM → NoC → three kernels → NoC → DRAM</h2>
  <p class="lede">A Tensix core is <b>five</b> RISC-V processors sharing 1.4&nbsp;MB of L1 SRAM.
  The reader (NCRISC) pulls tiles in over the NoC, compute (3&nbsp;× TRISC) transforms them,
  the writer (BRISC) pushes results out. They never call each other — <b>circular buffers in L1
  are the only thing connecting them.</b></p>
  <div class="pipewrap"><div class="pipe">
    <div class="pnode dram"><span class="nm">DRAM</span><span class="ds">src tensor<br>12 GB · 6 ch</span></div>
    <div class="flow"><span class="lbl">NoC read</span><div class="track"><span class="dot-anim"></span><span class="dot-anim d2"></span></div><span class="lbl">~195 GB/s</span></div>
    <div class="core">
      <div class="pnode reader"><span class="nm">reader.cpp</span><span class="ds">NCRISC<br>data movement</span></div>
      <div class="flow"><span class="lbl t">reserve · push</span><div class="track"><span class="dot-anim"></span></div><span class="lbl a">wait · pop</span></div>
      <div class="cbnode"><svg class="ring" id="miniring1" width="64" height="64" viewBox="0 0 64 64"></svg><span class="nm">cb_in (L1)</span></div>
      <div class="flow"><span class="lbl t">reserve · push</span><div class="track"><span class="dot-anim"></span></div><span class="lbl a">wait · pop</span></div>
      <div class="pnode compute"><span class="nm">compute.cpp</span><span class="ds">TRISC 0/1/2<br>unpack · math · pack</span><span class="dstchip">DST ×8 tiles</span></div>
      <div class="flow vio"><span class="lbl t">reserve · push</span><div class="track"><span class="dot-anim"></span></div><span class="lbl a">wait · pop</span></div>
      <div class="cbnode"><svg class="ring vio" id="miniring2" width="64" height="64" viewBox="0 0 64 64"></svg><span class="nm">cb_out (L1)</span></div>
      <div class="flow"><span class="lbl"></span><div class="track"><span class="dot-anim"></span></div><span class="lbl"></span></div>
      <div class="pnode writer"><span class="nm">writer.cpp</span><span class="ds">BRISC<br>data movement</span></div>
    </div>
    <div class="flow out"><span class="lbl">NoC write</span><div class="track"><span class="dot-anim"></span><span class="dot-anim d2"></span></div><span class="lbl"></span></div>
    <div class="pnode dram"><span class="nm">DRAM</span><span class="ds">dst tensor</span></div>
  </div></div>
  <div class="legend2">
    <span><span class="sw" style="background:var(--teal)"></span><b>producer side</b> — reserve space, fill it, publish</span>
    <span><span class="sw" style="background:var(--amber)"></span><b>consumer side</b> — wait for data, use it, release</span>
    <span><b>32 CB slots per core</b>, by convention 0–7 in, 16–23 out</span>
    <span><b>CBs are per-core & private</b> — cores never share one</span>
  </div>
  <p class="src-note">kernel_dojo/theory/02-the-chip.md · 04-circular-buffers.md</p>
</div>`},

{t:"Where everything lives", h:`

  <p class="lede">There is <b>no cache</b> — nothing moves unless a kernel issues the transfer.
  Step a tile of <code>a + b</code> through every level it visits. Watch the bottom panel:
  it tells you <em>who can even touch</em> the memory the tile is currently in — that reachability
  is the whole reason CBs, SrcA/SrcB, and DST all have to exist.</p>

{t:"Anatomy — a ring of pages", h:`
<div class="wrap">
  <p class="eyebrow">04 · anatomy</p>
  <h2>A fixed ring of pages; two pointers that wrap</h2>
  <p class="lede">A CB is defined by two numbers: <b>page size</b> (2048 B — one bfloat16 tile)
  and <b>number of pages</b> (the depth, your double-buffering knob). The pointers chase each
  other around the ring, so 4 pages can carry thousands of tiles without moving a byte.
  Drive it yourself:</p>
  <div class="demo3">
    <div class="vizcol">
      <svg class="ring" id="demoring" width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="circular buffer ring"></svg>
      <div style="display:flex;gap:12px">
        <button class="bigbtn push" id="demopush">producer: push tile</button>
        <button class="bigbtn pop" id="demopop">consumer: pop tile</button>
      </div>
    </div>
    <div class="facts">
      <div class="demomsg" id="demomsg">the ring is empty — the producer goes first</div>
      <div class="factrow"><span class="k">pages (depth)</span><span class="v2">4 × 2048 B</span></div>
      <div class="factrow"><span class="k">visible to consumer</span><span class="v2 t" id="demovis">0</span></div>
      <div class="factrow"><span class="k">free for producer</span><span class="v2" id="demofree">4</span></div>
      <div class="factrow"><span class="k">total pushed / popped</span><span class="v2" id="demotot">0 / 0</span></div>
      <div class="factrow"><span class="k">tiles through the ring</span><span class="v2 g" id="demothru">0 — watch the pointers wrap past page 3</span></div>
      <p style="color:var(--muted);font-size:13.5px;margin:6px 0 0;max-width:46ch">Depth 1 forces producer
      and consumer to alternate. Depth 2 is <b>double buffering</b> — one page being filled while
      the other is consumed. Deeper absorbs timing jitter, at the cost of L1.</p>
    </div>
  </div>
</div>`},

{t:"The four operations", h:`
<div class="wrap">
  <p class="eyebrow">05 · the api</p>
  <h2>Four calls. Two of them block.</h2>
  <p class="lede">Producer and consumer each get a two-step protocol. The first call of each
  pair <b>blocks</b> — that's what keeps the kernels in step, and it's what hangs when your
  counts are wrong.</p>
  <table class="opstable">
    <tr><th style="width:90px"></th><th>producer side <span class="t">(fills the CB)</span></th><th>consumer side <span class="a">(drains it)</span></th></tr>
    <tr><td class="mono" style="color:var(--muted);font-size:11px">CLAIM<br>blocks ⏳</td>
        <td><code class="t">cb_reserve_back(cb, n)</code><br><span style="color:var(--muted);font-size:13px">block until n pages are free</span></td>
        <td><code class="a">cb_wait_front(cb, n)</code><br><span style="color:var(--muted);font-size:13px">block until n pages hold data</span></td></tr>
    <tr><td class="mono" style="color:var(--muted);font-size:11px">LOCATE</td>
        <td><code>get_write_ptr(cb)</code><br><span style="color:var(--muted);font-size:13px">address of the reserved run — <b>does not advance</b></span></td>
        <td><code>get_read_ptr(cb)</code><br><span style="color:var(--muted);font-size:13px">address of the front of the visible window</span></td></tr>
    <tr><td class="mono" style="color:var(--muted);font-size:11px">USE</td>
        <td><span style="color:var(--muted);font-size:13px">NoC read lands a tile there — <code>noc_async_read_barrier()</code> <b>before</b> publishing</span></td>
        <td><span style="color:var(--muted);font-size:13px">NoC write streams it out — <code>noc_async_write_barrier()</code> <b>before</b> releasing</span></td></tr>
    <tr><td class="mono" style="color:var(--muted);font-size:11px">HAND OFF</td>
        <td><code class="t">cb_push_back(cb, n)</code><br><span style="color:var(--muted);font-size:13px">publish — consumer can now see it</span></td>
        <td><code class="a">cb_pop_front(cb, n)</code><br><span style="color:var(--muted);font-size:13px">release — producer can reuse the page</span></td></tr>
  </table>
  <p class="lede" style="margin-top:18px">Tile indices in compute calls are <b>relative to the
  visible window</b>, not to your tensor: after <code>cb_wait_front(cb, 4)</code> the visible tiles
  are 0–3, and after the pop the <em>next</em> four are 0–3 again. The window slides; the indices restart.</p>
  <p class="src-note">kernel_dojo/theory/04-circular-buffers.md — “The four operations”</p>
</div>`},

{t:"Live · lesson 03 — the FPU path", h:`
<div class="wrap">
  <p class="eyebrow">08 · live simulation · exercise 03_eltwise_binary</p>
  <h2>The FPU path: two operands, straight from L1</h2>
  <p class="lede">Lesson 02 staged every tile into DST because the <b>SFPU</b> can only work in
  place. The <b>FPU</b> — the matrix engine, where the FLOP/s live — reads <b>both operands from the
  CBs</b> — the unpacker fills SrcA/SrcB for you (slide 3), so <code>copy_tile</code> disappears
  and one <code>add_tiles</code> call does the work. Compute is now a consumer of <em>two</em> buffers at once, so it must
  reconcile <em>three</em> ledgers. The reader issues both DRAM reads before one barrier, so the
  round trips overlap. Watch the front pages of cb_a and cb_b flash amber as the FPU pulls from them.</p>

/* ============================== CB model ============================== */
function newCB(cap){return {capacity:cap,
  pages:Array.from({length:cap},()=>({state:"free",tile:null})),
  rd:0, wrRes:0, wrPush:0, free:cap, visible:0, pushed:0, popped:0};}
const pageAt=(cb,i)=>cb.pages[((i%cb.capacity)+cb.capacity)%cb.capacity];

function cbReserve(cb,n){
  if(n>cb.capacity) return {blocked:"cb_reserve_back("+n+") can NEVER succeed — the CB only has "+cb.capacity+" pages"};
  if(cb.free<n) return {blocked:"cb_reserve_back — need "+n+" free, have "+cb.free};
  for(let k=0;k<n;k++) pageAt(cb,cb.wrRes+k).state="reserved";
  cb.wrRes+=n; cb.free-=n; return null;
}
function cbPush(cb,n){
  for(let k=0;k<n;k++) pageAt(cb,cb.wrPush+k).state="ready";
  cb.wrPush+=n; cb.visible+=n; cb.pushed+=n; return null;
}
function cbWait(cb,n){
  if(n>cb.capacity) return {blocked:"cb_wait_front("+n+") can NEVER succeed — the CB only has "+cb.capacity+" pages"};
  if(cb.visible<n) return {blocked:"cb_wait_front — need "+n+" visible, have "+cb.visible};
  return null;
}
function cbPop(cb,n){
  for(let k=0;k<n;k++){const p=pageAt(cb,cb.rd+k); p.state="free"; p.tile=null;}
  cb.rd+=n; cb.visible-=n; cb.free+=n; cb.popped+=n; return null;
}
function barrierReads(cb,srcArr){
  for(const p of cb.pages) if(p.state==="filling") p.state="full";
  if(srcArr) for(let i=0;i<srcArr.length;i++) if(srcArr[i].state==="reading") srcArr[i].state="read";
}
function barrierWrites(cb,dstArr){
  for(const p of cb.pages) if(p.state==="draining") p.state="ready";
  if(dstArr) for(const c of dstArr) if(c.state==="writing") c.state="written";
}

/* ============================== sim engine ============================== */
const allSims=[];
class Sim{
  constructor(id,build,render){this.id=id;this.buildFn=build;this.renderFn=render;this.timer=null;allSims.push(this);this.reset();}
  reset(){this.stopPlay();const s=this.buildFn();this.kernels=s.kernels;this.state=s;this.tick=0;this.stall=0;this.hang=false;this.render();}
  get running(){return this.kernels.some(k=>!k.done);}
  step(){
    if(this.hang||!this.running) return;
    let progressed=false;
    for(const k of this.kernels){
      if(k.done) continue;
      const ins=k.program[k.pc];
      const r=ins.run(k,this.state)||{};
      if(r.blocked){k.blocked=r.blocked;}
      else{k.blocked=null;progressed=true;if(!r.stay&&!r.jumped&&!k.done)k.pc++;}
    }
    this.tick++;
    if(!progressed){this.stall++;if(this.stall>=4){this.hang=true;this.stopPlay();}}
    else this.stall=0;
    if(!this.running){this.stopPlay();if(this.onDone)this.onDone(this);}
    this.render();
  }
  render(){this.renderFn(this);}
  playToggle(){
    if(this.timer){this.stopPlay();}
    else{
      if(this.hang||!this.running) this.reset();
      this.timer=setInterval(()=>{this.step();if(this.hang||!this.running)this.stopPlay();},420);
      if(this.playBtn)this.playBtn.textContent="⏸ pause";
    }
  }
  stopPlay(){if(this.timer){clearInterval(this.timer);this.timer=null;}if(this.playBtn)this.playBtn.textContent="▶ play";}
}
function wireSim(sim,prefix){
  $(prefix+"-step").onclick=()=>{sim.stopPlay();sim.step();};
  sim.playBtn=$(prefix+"-play");
  sim.playBtn.onclick=()=>sim.playToggle();
  $(prefix+"-reset").onclick=()=>sim.reset();
}

/* ============================== render helpers ============================== */
function paneHTML(k){
  const cur=(!k.done)?k.program[k.pc].line:-1;
  const lines=k.lines.map((ln,idx)=>{
    let cls="cl";

  const st=k.done?'<span class="st-done">✓ kernel_main returned</span>'

    +'<pre class="code">'+lines+'</pre><div class="pane-ft">'+st+"</div>";
}
function pol(cx,cy,r,aDeg){const a=aDeg*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arcPath(cx,cy,r0,r1,a0,a1){
  const [x0,y0]=pol(cx,cy,r1,a0),[x1,y1]=pol(cx,cy,r1,a1),
        [x2,y2]=pol(cx,cy,r0,a1),[x3,y3]=pol(cx,cy,r0,a0);
  const lg=(a1-a0)>180?1:0;
  return "M"+x0.toFixed(1)+" "+y0.toFixed(1)+" A"+r1+" "+r1+" 0 "+lg+" 1 "+x1.toFixed(1)+" "+y1.toFixed(1)
    +" L"+x2.toFixed(1)+" "+y2.toFixed(1)+" A"+r0+" "+r0+" 0 "+lg+" 0 "+x3.toFixed(1)+" "+y3.toFixed(1)+" Z";
}
function drawRing(svgId,cb,opts){
  const svg=(typeof svgId==="string")?$(svgId):svgId; if(!svg) return;
  const o=opts||{};
  const size=svg.viewBox.baseVal.width||parseFloat(svg.getAttribute("width"));
  const showPtr=!o.noPtr&&cb.capacity>1&&size>=160;
  const cx=size/2,cy=size/2,r1=size/2-(showPtr?16:4),r0=r1*0.58;
  const cap=cb.capacity;let out="";
  if(cap===1){
    const p=cb.pages[0];
    out+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((r0+r1)/2)+'" fill="none" stroke-width="'+(r1-r0)+'" class="pg pg-'+p.state+'" style="fill:none"/>';
    if(p.tile!==null){const [tx,ty]=pol(cx,cy,(r0+r1)/2,-90);out+='<text x="'+tx+'" y="'+ty+'" class="pgt">'+p.tile+"</text>";}
  }else{
    const gap=Math.min(5,360/cap*0.06);
    for(let i=0;i<cap;i++){
      const a0=-90+i*360/cap+gap,a1=-90+(i+1)*360/cap-gap;
      const p=cb.pages[i];
      out+='<path d="'+arcPath(cx,cy,r0,r1,a0,a1)+'" class="pg pg-'+p.state+'"/>';
      const am=(a0+a1)/2,[tx,ty]=pol(cx,cy,(r0+r1)/2,am);
      const lbl=p.tile!==null?p.tile:(p.state==="free"?"":"·");
      const tcls=(p.state==="ready"||p.state==="draining")?"pgt":"pgt pg-free-t";
      if(lbl!=="")out+='<text x="'+tx.toFixed(1)+'" y="'+ty.toFixed(1)+'" class="'+tcls+'">'+lbl+"</text>";
    }
    if(showPtr){
      const slotMid=idx=>-90+((((idx%cap)+cap)%cap)+0.5)*360/cap;
      const wAng=slotMid(cb.wrRes),rAng=slotMid(cb.rd);
      const [wlx,wly]=pol(cx,cy,r1+9,wAng);
      const [rlx,rly]=pol(cx,cy,Math.max(r0-11,10),rAng);
      out+='<text x="'+wlx.toFixed(1)+'" y="'+wly.toFixed(1)+'" class="ptr ptr-wr">W▸</text>'
         +'<text x="'+rlx.toFixed(1)+'" y="'+rly.toFixed(1)+'" class="ptr ptr-rd">R</text>';
    }
  }
  if(!o.noCenter){
    out+='<text x="'+cx+'" y="'+(cy-3)+'" class="ctr-n">'+cb.visible+"/"+cap+"</text>"
       +'<text x="'+cx+'" y="'+(cy+13)+'" class="ctr-l">visible</text>';
  }
  svg.innerHTML=out;
}
function stripHTML(arr,vio){

    let cls="tile t-"+c.state; if(c.wrong)cls+=" t-wrong"; if(vio&&c.state==="written")cls+=" vio";

    if(c.val===null)lbl="?";
    return '<div class="'+cls+'" title="tile '+i+'">'+lbl+"</div>";
  }).join("");
}
function totalsHTML(cb){

function readerLines1(){return [

"}"];}
function writerLines1(){return [
"for (uint32_t i = 0; i < n_tiles; i++) {",

"    noc_async_write_page(i, dst, addr);",

"    cb_pop_front(cb, 1);",
"}"];}
function loopIns(n,step){return {line:0,run:k=>{k.i+=(step||1);if(k.i<n){k.pc=0;return{jumped:true};}k.done=true;return{jumped:true};}};}

function buildCopySim(n,depth){
  const cb=newCB(depth);
  const src=Array.from({length:n},()=>({state:"idle"}));
  const dst=Array.from({length:n},()=>({state:"empty"}));
  const reader={name:"reader.cpp",proc:"NCRISC · producer",color:"teal",i:0,pc:0,done:false,blocked:null,
    lines:readerLines1(),
    program:[
      {line:1,run:()=>cbReserve(cb,1)},
      {line:2,run:()=>null},
      {line:3,run:k=>{const p=pageAt(cb,cb.wrPush);p.state="filling";p.tile=k.i;src[k.i].state="reading";return null;}},
      {line:4,run:()=>{barrierReads(cb,src);return null;}},
      {line:5,run:()=>cbPush(cb,1)},
      loopIns(n)
    ]};
  const writer={name:"writer.cpp",proc:"BRISC · consumer",color:"amber",i:0,pc:0,done:false,blocked:null,
    lines:writerLines1(),
    program:[
      {line:1,run:()=>cbWait(cb,1)},
      {line:2,run:()=>null},
      {line:3,run:k=>{const p=pageAt(cb,cb.rd);p.state="draining";dst[k.i]={state:"writing",val:p.tile};return null;}},
      {line:4,run:()=>{barrierWrites(cb,dst);return null;}},
      {line:5,run:()=>cbPop(cb,1)},

  return {kernels:[reader,writer],cb,src,dst};
}

"        noc_async_write_page(i + t, dst,",

"    noc_async_write_barrier();  // drains all block writes",
"    cb_pop_front(cb, block);",

    program:[
      {line:1,run:()=>cbWait(cb,B)},

  if(l05res[1]!==undefined)parts.push("block 1 → <b>"+l05res[1]+"</b> cycles");
  if(l05res[4]!==undefined)parts.push("block 4 → <b>"+l05res[4]+"</b> cycles");
  $("l05-res").innerHTML=parts.join(" · ")+(parts.length===2?" <span class='g'>✓</span>":"");
}
const l05=new Sim("l05",buildL05,renderL05);
l05.onDone=s=>{l05res[l05block]=s.tick;};

/* ============================== pitfalls ============================== */
function buildPfA(){
  const cb=newCB(2);
  const reader={name:"reader.cpp",proc:"NCRISC",color:"teal",i:0,pc:0,done:false,blocked:null,
    lines:["// host created this CB with n_pages = 2","","cb_reserve_back(cb, 4);  // ← 4 > 2","..."],
    program:[{line:2,run:()=>cbReserve(cb,4)}]};
  const writer={name:"writer.cpp",proc:"BRISC",color:"amber",i:0,pc:0,done:false,blocked:null,
    lines:["// host created this CB with n_pages = 2","","cb_wait_front(cb, 4);    // ← 4 > 2","..."],
    program:[{line:2,run:()=>cbWait(cb,4)}]};
  return {kernels:[reader,writer],cb};
}
function renderPfA(sim){
  const s=sim.state;
  $("pfA-rp").innerHTML=paneHTML(sim.kernels[0]);
  $("pfA-wp").innerHTML=paneHTML(sim.kernels[1]);
  drawRing("pfA-ring",s.cb);
  $("pfA-tot").innerHTML=totalsHTML(s.cb);
  $("pfA-tick").textContent=sim.tick;
  $("pfA-hang").className="hangbar"+(sim.hang?" on":"");
  if(sim.hang)$("pfA-hang").innerHTML=hangHTML("Symptom row 1 of the diagnosis table: <em>hangs immediately, first iteration</em>.");
}
const pfA=new Sim("pfA",buildPfA,renderPfA);

function buildPfB(){
  const base=buildCopySim(6,2);
  const cb=base.cb,dst=base.dst;
  const writer={name:"writer.cpp",proc:"BRISC",color:"amber",i:0,pc:0,done:false,blocked:null,
    lines:[
"for (uint32_t i = 0; i < n_tiles; i++) {",
"    cb_wait_front(cb, 1);",
"    uint32_t addr = get_read_ptr(cb); // front never moves",
"    noc_async_write_page(i, dst, addr);",
"    noc_async_write_barrier();",
"    // cb_pop_front(cb, 1);   ← MISSING",
"}"],
    program:[
      {line:1,run:()=>cbWait(cb,1)},
      {line:2,run:()=>null},
      {line:3,run:k=>{const p=pageAt(cb,cb.rd);dst[k.i]={state:"writing",val:p.tile};return null;}},
      {line:4,run:()=>{barrierWrites(cb,dst);return null;}},
      loopIns(6)
    ]};
  return {kernels:[base.kernels[0],writer],cb,src:base.src,dst};
}
function renderPfHang(sim,prefix,extraMsg){
  const s=sim.state;
  $(prefix+"-rp").innerHTML=paneHTML(sim.kernels[0]);
  $(prefix+"-wp").innerHTML=paneHTML(sim.kernels[1]);
  drawRing(prefix+"-ring",s.cb);
  $(prefix+"-tot").innerHTML=totalsHTML(s.cb)+' · <span class="r">pushed ≠ popped</span>';
  if($(prefix+"-src"))$(prefix+"-src").innerHTML=stripHTML(s.src);
  if($(prefix+"-dst")){
    const d=s.dst.map((c,i)=>({...c,wrong:c.state==="written"&&c.val!==i}));
    $(prefix+"-dst").innerHTML=stripHTML(d);
  }
  $(prefix+"-tick").textContent=sim.tick;
  $(prefix+"-hang").className="hangbar"+(sim.hang?" on":"");
  if(sim.hang)$(prefix+"-hang").innerHTML=hangHTML(extraMsg);
  const ok=!sim.running&&!sim.hang;
  const doneEl=$(prefix+"-done");
  doneEl.className="donebar"+(ok?" on":"");
}
const pfB=new Sim("pfB",buildPfB,s=>renderPfHang(s,"pfB",
  "The writer finished all 6 iterations (re-reading tile 0 each time) — the reader is stuck at cb_reserve_back with 0 free pages. Symptom row 2: <em>hangs after a few iterations</em>."));

function buildPfC(){
  const cb=newCB(4);
  const src=Array.from({length:4},()=>({state:"idle"}));
  const dst=Array.from({length:4},()=>({state:"empty"}));
  const reader={name:"reader.cpp",proc:"NCRISC",color:"teal",i:0,t:0,pc:0,done:false,blocked:null,
    lines:[
"cb_reserve_back(cb, 4);",
"for (uint32_t t = 0; t < 4; t++) {",
"    uint32_t addr = get_write_ptr(cb); // same addr!",
"    noc_async_read_page(t, src, addr);",
"}",
"noc_async_read_barrier();",
"cb_push_back(cb, 4);"],
    program:[
      {line:0,run:()=>cbReserve(cb,4)},
      {line:2,run:()=>null},
      {line:3,run:k=>{const p=pageAt(cb,cb.wrPush);p.state="filling";p.tile=k.t;src[k.t].state="reading";k.t++;
        if(k.t<4){k.pc=1;return{jumped:true};}return null;}},
      {line:5,run:()=>{barrierReads(cb,src);return null;}},
      {line:6,run:k=>{cbPush(cb,4);k.done=true;return{jumped:true};}}
    ]};
  const writer={name:"writer.cpp",proc:"BRISC",color:"amber",i:0,pc:0,done:false,blocked:null,
    lines:writerLines1(),
    program:[
      {line:1,run:()=>cbWait(cb,1)},
      {line:2,run:()=>null},
      {line:3,run:k=>{const p=pageAt(cb,cb.rd);p.state="draining";dst[k.i]={state:"writing",val:p.tile};return null;}},
      {line:4,run:()=>{barrierWrites(cb,dst);return null;}},
      {line:5,run:()=>cbPop(cb,1)},
      loopIns(4)
    ]};
  return {kernels:[reader,writer],cb,src,dst};
}
const pfC=new Sim("pfC",buildPfC,sim=>{
  renderPfHang(sim,"pfC","");
  $("pfC-tot").innerHTML=totalsHTML(sim.state.cb);
  const ok=!sim.running&&!sim.hang;
  const doneEl=$("pfC-done");
  doneEl.className="donebar"+(ok?" on":"");
  if(ok){
    const s=sim.state,wrong=s.dst.filter((c,i)=>c.val!==i).length;
    doneEl.innerHTML="<span class='r'>✗ finished cleanly, PCC check fails: "+wrong
      +" of 4 output tiles wrong — dst[0] holds tile 3 (last overwrite wins), the rest were never written. No hang, no error message.</span>";
  }
});
