<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throughput Dojo</title>
<meta name="description" content="Interactive walkthrough of tt-metal kernel performance — multi-core scaling, batched NoC transactions, matmul K-accumulation, operand reuse, math fidelity — with the kernel dojo's real measured numbers.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<style>
/* ---------- tokens: dark-first (deliberate), light overrides both ways ---------- */
:root{
  --bg:#0e1118; --panel:#151a24; --panel2:#1b2230; --code-bg:#10141d;
  --line:#2a3245; --text:#e6eaf3; --muted:#8f97ab; --faint:#5b647a;
  --teal:#45c8bb; --amber:#e8a84c; --violet:#9d7bf5; --red:#ef6b6b; --green:#5bc17e;
  --hl:#233048; --hl-blk:#3d2330;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f3f7; --panel:#ffffff; --panel2:#e9ebf3; --code-bg:#f6f7fb;
    --line:#d4d8e4; --text:#20263a; --muted:#5d6579; --faint:#8b92a6;
    --teal:#0d8f82; --amber:#a86f10; --violet:#6b46d8; --red:#c04545; --green:#2e8f57;
    --hl:#dfe7f5; --hl-blk:#f6dcdc;
  }
}
:root[data-theme="light"]{
  --bg:#f2f3f7; --panel:#ffffff; --panel2:#e9ebf3; --code-bg:#f6f7fb;
  --line:#d4d8e4; --text:#20263a; --muted:#5d6579; --faint:#8b92a6;
  --teal:#0d8f82; --amber:#a86f10; --violet:#6b46d8; --red:#c04545; --green:#2e8f57;
  --hl:#dfe7f5; --hl-blk:#f6dcdc;
}
:root[data-theme="dark"]{
  --bg:#0e1118; --panel:#151a24; --panel2:#1b2230; --code-bg:#10141d;
  --line:#2a3245; --text:#e6eaf3; --muted:#8f97ab; --faint:#5b647a;
  --teal:#45c8bb; --amber:#e8a84c; --violet:#9d7bf5; --red:#ef6b6b; --green:#5bc17e;
  --hl:#233048; --hl-blk:#3d2330;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.55;overflow:hidden}
h1,h2,h3{font-family:var(--mono);letter-spacing:-.02em;text-wrap:balance;margin:0}
code,pre,kbd,.mono{font-family:var(--mono)}
button{font-family:var(--mono);cursor:pointer}
a{color:var(--teal)}

#deck{height:calc(100% - 52px);position:relative}
.slide{display:none;height:100%;overflow-y:auto;overflow-x:hidden}
.slide.active{display:block;animation:fadein .28s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .slide.active{animation:none}
  .pg-filling,.pg-draining,.flight.on,.t-reading,.t-writing,rect.band{animation:none !important}
  .fbar .bar{transition:none !important}
}
.wrap{max-width:1280px;margin:0 auto;padding:28px 40px 40px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.eyebrow b{color:var(--teal);font-weight:600}
h2{font-size:26px;margin-bottom:6px}
.lede{color:var(--muted);max-width:70ch;margin:4px 0 20px}
.lede code{color:var(--text);font-size:.92em}
.src-note{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:18px}

/* ---------- deck bar ---------- */
#deckbar{height:52px;border-top:1px solid var(--line);background:var(--panel);
  display:flex;align-items:center;gap:14px;padding:0 20px}
#deckbar .title{font-family:var(--mono);font-size:12px;color:var(--muted);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#deckbar .dots{display:flex;gap:8px}
#deckbar .dots button{width:10px;height:10px;border-radius:50%;border:1px solid var(--faint);
  background:transparent;padding:0}
#deckbar .dots button.on{background:var(--teal);border-color:var(--teal)}
#deckbar .dots button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.navbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:6px;padding:6px 14px;font-size:13px}
.navbtn:hover{border-color:var(--teal)}
.navbtn:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
#pgnum{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:44px;text-align:center}

/* ---------- title slide ---------- */
.hero{display:flex;flex-direction:column;justify-content:center;min-height:82%;max-width:1100px;margin:0 auto;padding:40px}
.hero h1{font-size:clamp(38px,6vw,68px);line-height:1.06;font-weight:700}
.hero h1 .dim{color:var(--faint)}
.hero .sub{font-size:17px;color:var(--muted);max-width:64ch;margin-top:18px}
.hero .hint{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:30px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;font-size:11px;background:var(--panel)}
.api-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.api-chips code{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:12.5px}
.api-chips .c-t{color:var(--teal)} .api-chips .c-a{color:var(--amber)} .api-chips .c-v{color:var(--violet)}

/* ---------- generic panels & tables ---------- */
.panelbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
table.opstable{border-collapse:collapse;width:100%;font-size:14px}
table.opstable th,table.opstable td{border:1px solid var(--line);padding:9px 14px;text-align:left}
table.opstable th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--panel2)}
table.opstable code{font-size:13px}
table.opstable td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.t{color:var(--teal)} .a{color:var(--amber)} .v{color:var(--violet)} .r{color:var(--red)} .g{color:var(--green)}
blockquote.rule{border-left:3px solid var(--teal);margin:18px 0;padding:10px 20px;background:var(--panel);
  border-radius:0 8px 8px 0;font-size:16px;max-width:76ch}
blockquote.rule b{color:var(--teal)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:18px}
@media (max-width:900px){.twocol{grid-template-columns:1fr}}
.gonext{font-family:var(--mono);font-size:13px;background:var(--code-bg);border:1px solid var(--line);
  border-radius:8px;padding:14px 18px;line-height:2}
.gonext .c{color:var(--faint)}

/* ---------- sim layout ---------- */
.simbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 16px}
.simbar .sp{flex:1}
.ctl{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;
  padding:7px 16px;font-size:13px}
.ctl:hover{border-color:var(--teal)}
.ctl:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.ctl.primary{background:var(--teal);color:var(--bg);border-color:var(--teal);font-weight:700}
.tickbox{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tickbox b{color:var(--text)}
.optgrp{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.optgrp button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:5px 11px;font-size:12px}
.optgrp button.on{border-color:var(--teal);color:var(--teal);background:color-mix(in srgb,var(--teal) 10%,transparent)}
.optgrp button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.hangbar{display:none;background:color-mix(in srgb,var(--red) 14%,var(--panel));border:1px solid var(--red);
  color:var(--text);border-radius:8px;padding:10px 16px;font-size:13.5px;margin:0 0 14px}
.hangbar.on{display:block}
.hangbar b{color:var(--red);font-family:var(--mono)}
.donebar{display:none;background:color-mix(in srgb,var(--green) 12%,var(--panel));border:1px solid var(--green);
  border-radius:8px;padding:10px 16px;font-size:13.5px;margin:0 0 14px}
.donebar.on{display:block}
.simgrid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1.08fr) minmax(300px,1fr);gap:18px;align-items:start}
.simgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:start}
@media (max-width:1000px){.simgrid,.simgrid3{grid-template-columns:1fr}}

.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pane-hd{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.pane-hd .kname{font-family:var(--mono);font-size:12.5px;font-weight:600}
.proc{font-family:var(--mono);font-size:10px;letter-spacing:.08em;border-radius:4px;padding:2px 7px;border:1px solid}
.proc-teal{color:var(--teal);border-color:var(--teal)}
.proc-amber{color:var(--amber);border-color:var(--amber)}
.proc-violet{color:var(--violet);border-color:var(--violet)}
pre.code{margin:0;padding:10px 0;background:var(--code-bg);font-size:12.3px;line-height:1.62;overflow-x:auto}
.cl{padding:0 14px;white-space:pre}
.cl-cur{background:var(--hl);box-shadow:inset 3px 0 0 var(--teal)}
.pane.amberside .cl-cur{box-shadow:inset 3px 0 0 var(--amber)}
.pane.violetside .cl-cur{box-shadow:inset 3px 0 0 var(--violet)}
.cl-blk{background:var(--hl-blk);box-shadow:inset 3px 0 0 var(--red)}
.cl-mark{background:var(--hl)}
.pane-ft{padding:7px 12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;min-height:34px}
.st-run{color:var(--muted)} .st-done{color:var(--green)} .st-blk{color:var(--red)}

/* ---------- CB ring, strips, DST ---------- */
.vizcol{display:flex;flex-direction:column;align-items:center;gap:10px}
.vizcol .cbcap{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.vizcol .cbcap b{color:var(--text)}
svg.ring{overflow:visible}
.pg{stroke-width:1.5}
.pg-free{fill:var(--panel2);stroke:var(--line)}
.pg-reserved{fill:color-mix(in srgb,var(--teal) 14%,transparent);stroke:var(--teal);stroke-dasharray:4 3}
.pg-filling{fill:color-mix(in srgb,var(--teal) 45%,transparent);stroke:var(--teal);animation:pgpulse 1s ease-in-out infinite}
.pg-full{fill:color-mix(in srgb,var(--teal) 65%,transparent);stroke:var(--teal);stroke-dasharray:4 3}
.pg-ready{fill:var(--teal);stroke:var(--teal)}
.pg-draining{fill:var(--amber);stroke:var(--amber);animation:pgpulse 1s ease-in-out infinite}
.ring.vio .pg-reserved{fill:color-mix(in srgb,var(--violet) 14%,transparent);stroke:var(--violet)}
.ring.vio .pg-filling,.ring.vio .pg-full{fill:color-mix(in srgb,var(--violet) 55%,transparent);stroke:var(--violet)}
.ring.vio .pg-ready{fill:var(--violet);stroke:var(--violet)}
@keyframes pgpulse{50%{opacity:.55}}
@keyframes nocblink{50%{opacity:.4}}
.pgt{font-family:var(--mono);font-size:13px;font-weight:700;fill:var(--bg);text-anchor:middle;dominant-baseline:central}
.pg-reserved-t,.pg-free-t{fill:var(--muted)}
.ctr-n{font-family:var(--mono);font-size:20px;font-weight:700;fill:var(--text);text-anchor:middle}
.ctr-l{font-family:var(--mono);font-size:9px;letter-spacing:.1em;fill:var(--muted);text-anchor:middle;text-transform:uppercase}
.ptr{font-family:var(--mono);font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.ptr-rd{fill:var(--amber)} .ptr-wr{fill:var(--teal)}

.strip{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.striplbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:center;margin-bottom:5px}
.tile{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--faint);background:var(--panel2)}
.t-reading{border-color:var(--teal);color:var(--teal);animation:pgpulse 1s infinite}
.t-read{background:color-mix(in srgb,var(--teal) 22%,var(--panel2));border-color:var(--teal);color:var(--text)}
.t-empty{border-style:dashed}
.t-writing{border-color:var(--amber);color:var(--amber);animation:pgpulse 1s infinite}
.t-written{background:var(--amber);border-color:var(--amber);color:var(--bg)}
.t-written.vio,.tile.vio.t-written{background:var(--violet);border-color:var(--violet)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--muted);justify-content:center}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}

.dstbox{display:flex;flex-direction:column;align-items:center;gap:7px}
.dstslots{display:flex;gap:4px}
.dsts{width:26px;height:26px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--faint)}
.dsts.on{background:var(--violet);border-color:var(--violet);color:var(--bg);font-weight:700}
.holder{font-family:var(--mono);font-size:10.5px;border-radius:99px;padding:3px 12px;border:1px solid var(--line);color:var(--muted)}
.holder.math{color:var(--violet);border-color:var(--violet)}
.holder.committed{color:var(--teal);border-color:var(--teal)}
.holder.pack{color:var(--amber);border-color:var(--amber)}
.flight{font-family:var(--mono);font-size:11px;border:1px dashed var(--line);border-radius:5px;padding:2px 10px;color:var(--faint);letter-spacing:.08em}
.flight.on{color:var(--teal);border-color:var(--teal);animation:nocblink .8s infinite}

/* ---------- charts ---------- */
svg.chart{display:block;max-width:100%;height:auto}
.axt{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.axt2{font-family:var(--mono);font-size:10px;font-weight:700;fill:var(--text)}
.chartcap{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin-top:4px}

/* ---------- stats & regime chips ---------- */
.statrow{display:flex;gap:26px;flex-wrap:wrap;margin:14px 0;align-items:flex-end}
.stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .u{font-size:12px;color:var(--muted);font-family:var(--mono)}
.regime{font-family:var(--mono);font-size:11.5px;border:1px solid;border-radius:99px;padding:3px 12px;display:inline-block}
.regime.mem{color:var(--teal);border-color:var(--teal)}
.regime.trans{color:var(--amber);border-color:var(--amber)}
.regime.other{color:var(--red);border-color:var(--red)}

/* ---------- slide 2: latency toy ---------- */
.latgrid{display:grid;grid-template-columns:minmax(420px,1.4fr) minmax(300px,1fr);gap:28px;align-items:start;margin-top:8px}
@media (max-width:1000px){.latgrid{grid-template-columns:1fr}}
.factrow{display:flex;gap:12px;align-items:baseline;margin-bottom:10px}
.factrow .k{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:190px}
.factrow .v2{font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- slide 3: core grid ---------- */
.mcgrid{display:grid;grid-template-columns:auto minmax(320px,1fr);gap:34px;align-items:start;margin-top:8px}
@media (max-width:1000px){.mcgrid{grid-template-columns:1fr}}
.coregrid{display:grid;grid-template-columns:repeat(8,36px);gap:5px}
.coregrid .cc{width:36px;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--faint);font-variant-numeric:tabular-nums}
.coregrid .cc.on{background:color-mix(in srgb,var(--teal) 30%,var(--panel2));border-color:var(--teal);color:var(--text)}

/* ---------- slide 5: matmul viz ---------- */
.mmgrid{display:grid;gap:4px;justify-content:center}
.accbox{border:1px solid var(--violet);border-radius:8px;padding:8px 14px;font-family:var(--mono);font-size:12px;min-width:230px;text-align:center;background:var(--panel)}
.accbox b{color:var(--violet)}
.trapcards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media (max-width:900px){.trapcards{grid-template-columns:1fr}}
.trap{background:var(--panel);border:1px solid var(--red);border-radius:10px;padding:12px 16px;font-size:13.5px}
.trap b{color:var(--red);font-family:var(--mono)}
.trap code{font-size:12px}
.trap pre{margin:8px 0 4px;padding:8px 10px;background:var(--code-bg);border-radius:6px;font-size:11.5px;line-height:1.6;overflow-x:auto}

/* ---------- slide 7: Mb diagram ---------- */
.mbdiag{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0}
.mbcol{display:flex;flex-direction:column;gap:4px;align-items:center}
.mbrow{display:flex;gap:3px}
.mq{width:18px;height:18px;border-radius:4px;border:1px solid var(--line);background:var(--panel2)}
.mq.a{background:color-mix(in srgb,var(--amber) 40%,var(--panel2));border-color:var(--amber)}
.mq.b{background:var(--teal);border-color:var(--teal)}
.mq.c{background:var(--violet);border-color:var(--violet)}
.mblbl{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:center}
.mbarrow{font-family:var(--mono);color:var(--faint);font-size:16px}

/* ---------- slide 7: lesson 08 race ---------- */
.racegrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:860px;margin:0 auto}
@media (max-width:900px){.racegrid{grid-template-columns:1fr}}
.lane{display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 16px}
.lanehd{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.lanehd b{color:var(--text)}
.bcnt{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--text)}
rect.band{animation:pgpulse 1.15s ease-in-out infinite}
.tmeter{width:100%;max-width:250px;height:14px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex}
.tm{height:100%;transition:width .45s ease}
.tm-a{background:var(--amber)} .tm-b{background:var(--teal)}
.tm-lbl{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tm-lbl b{color:var(--text);font-size:13px}
.lanest{font-family:var(--mono);font-size:11px;color:var(--muted);min-height:30px;text-align:center;max-width:260px}
.lanest .done{color:var(--green)}

/* ---------- slide 8: fidelity bars ---------- */
.fbars{display:flex;flex-direction:column;gap:12px;margin-top:16px;max-width:560px}
.fbar{display:grid;grid-template-columns:64px 1fr 110px;gap:12px;align-items:center;font-family:var(--mono);font-size:12.5px}
.fbar .lane{background:var(--panel2);border:1px solid var(--line);border-radius:4px;height:20px}
.fbar .bar{height:18px;border-radius:3px;background:var(--violet);transition:width .5s ease;min-width:3px;margin:0}
.fbar .tv{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.fbar .tv b{color:var(--text)}
</style>
</head>
<body>
<main id="deck"></main>
<nav id="deckbar">
  <button class="navbtn" id="prevb" aria-label="previous slide">◀</button>
  <span id="pgnum">1/10</span>
  <button class="navbtn" id="nextb" aria-label="next slide">▶</button>
  <span class="title" id="barTitle"></span>
  <span class="dots" id="dots"></span>
</nav>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ============================== slides ============================== */
const SLIDES = [
{t:"Throughput Dojo", h:`
<div class="hero">
  <p class="eyebrow"><b>tt-metal kernel dojo</b> · interactive walkthrough · part 2</p>
  <h1>Throughput<br>Dojo<span class="dim">.</span></h1>
  <p class="sub">Part 1 made kernels <em>correct</em>. This deck makes them <em>fast</em> — lessons
  04–08 of the dojo: multi-core, pipelining, matmul, and reuse. One question runs through all of it:
  <b style="color:var(--text)">which resource are you actually waiting on?</b> Every number in this
  deck was measured on a Wormhole n150 by <code>./dojo bench</code> — including two results that
  contradict the obvious guess.</p>
  <div class="api-chips">
    <code class="c-t">per-core runtime args</code><code class="c-t">noc_async_read_barrier</code>
    <code class="c-v">matmul_tiles</code><code class="c-v">SrcOrder::Reverse</code>
    <code class="c-a">MathFidelity</code><code>GB/s vs TFLOP/s</code>
  </div>
  <p class="hint"><kbd>→</kbd> next slide &nbsp;·&nbsp; <kbd>←</kbd> back &nbsp;·&nbsp;
  on sim slides: <b>step</b> advances every processor by one instruction</p>
</div>`},

{t:"Latency ≠ bandwidth", h:`
<div class="wrap">
  <p class="eyebrow">02 · foundations</p>
  <h2>Latency is not bandwidth — and you can only fix one of them</h2>
  <p class="lede">A DRAM read takes hundreds of cycles to <em>respond</em>, but the chip can move
  ~195&nbsp;GB/s in <em>volume</em>. You cannot make one request return sooner. You <b>can</b> stop
  waiting for it before issuing the next — get many requests <b>in flight</b> so their latencies
  overlap. Toggle the two strategies:</p>
  <div class="simbar">
    <span class="optgrp">strategy
      <button data-m="serial" class="on" id="lat-mserial">serial: wait each one out</button>
      <button data-m="over" id="lat-mover">overlapped: barrier once</button>
    </span>
    <span class="optgrp" style="margin-left:10px">requests
      <button data-n="2">2</button><button data-n="4" class="on">4</button><button data-n="8">8</button>
    </span>
  </div>
  <div class="latgrid">
    <div>
      <svg class="chart" id="lat-svg" role="img" aria-label="request timeline"></svg>
      <div class="chartcap" id="lat-cap"></div>
    </div>
    <div>
      <div class="panelbox" style="margin-bottom:16px">
        <div class="factrow"><span class="k">total time</span><span class="v2" id="lat-tot"></span></div>
        <div class="factrow"><span class="k">latency paid</span><span class="v2" id="lat-paid"></span></div>
        <div class="factrow"><span class="k">throughput</span><span class="v2" id="lat-thru"></span></div>
      </div>
      <pre class="code" style="border:1px solid var(--line);border-radius:8px"><div class="cl">noc_async_read_page(0, src, dst0); // returns NOW —</div><div class="cl">noc_async_read_page(1, src, dst1); //   data not here yet</div><div class="cl">noc_async_read_page(2, src, dst2);</div><div class="cl cl-mark">noc_async_read_barrier();  // wait ONCE, for all three</div></pre>
      <p style="color:var(--muted);font-size:13.5px;margin-top:14px">Measured stakes (lesson 04): one
      core issuing one read at a time reaches <b class="r">9.7&nbsp;GB/s</b>. The same chip, kept
      properly busy, reaches <b class="g">195&nbsp;GB/s</b> — <b>20× apart on identical hardware</b>.
      The requests never got faster; the waiting overlapped.</p>
    </div>
  </div>
  <p class="src-note">kernel_dojo/theory/01-latency-and-throughput.md §1–2 — the delivery truck, and “in flight”</p>
</div>`},

  binary</em> and differs only in its <b>per-core runtime args</b> — <code>start_tile</code> and

  one change is worth 20×. Pick a core count and watch the measured curve

{t:"Live · lesson 05 — batch & block", h:`
<div class="wrap">
  <p class="eyebrow">04 · live simulation · exercise 05_pipelining</p>
  <h2>Same 8 cores, 2.6× faster: batch the reads, block the DST</h2>

  pays the full DRAM round trip, serially. The fix is three-fold: issue <code>2×block</code> reads
  before <em>one</em> barrier (latencies overlap — watch the <b>in flight</b> badge), do the whole
  block in <em>one</em> <code>tile_regs_*</code> handshake, and give CBs <code>2×block</code> pages
  so producer and consumer never take turns. Run block&nbsp;1 to the end, then block&nbsp;4, and
  compare cycle counts.</p>

{t:"Live · lesson 06 — matmul accumulation", h:`
<div class="wrap">
  <p class="eyebrow">05 · live simulation · exercise 06_matmul</p>
  <h2>DST becomes an accumulator: Σ over K into one slot</h2>
  <p class="lede"><code>matmul_tiles</code> <b>accumulates</b>: <code>DST[0] += A_tile @ B_tile</code>.
  Since <code>tile_regs_acquire()</code> zeroes DST, the whole K-reduction is a loop into one slot —
  at the FPU's internal precision — and <b>one</b> <code>pack_tile</code> after the loop. Step the
  real kernels on a tiny <b>Mt=2, Kt=3, Nt=2</b> problem and watch the read counters: this kernel
  re-reads its inputs once per output row/column.</p>
  <div class="simbar">
    <button class="ctl primary" id="mm-step">⏵ step</button>
    <button class="ctl" id="mm-play">▶ play</button>
    <button class="ctl" id="mm-reset">↺ reset</button>
    <span class="sp"></span>
    <span class="tickbox" id="mm-reads"></span>
    <span class="tickbox">cycle <b id="mm-tick">0</b></span>
  </div>
  <div class="hangbar" id="mm-hang"></div>
  <div class="donebar" id="mm-done"></div>
  <div class="simgrid">
    <div class="pane" id="mm-rp"></div>
    <div class="vizcol">
      <div style="display:flex;gap:22px;align-items:flex-start;justify-content:center">
        <div><div class="striplbl">A · Mt×Kt (reads)</div><div class="mmgrid" id="mm-a" style="grid-template-columns:repeat(3,30px)"></div></div>
        <div><div class="striplbl">B · Kt×Nt (reads)</div><div class="mmgrid" id="mm-b" style="grid-template-columns:repeat(2,30px)"></div></div>
      </div>
      <div style="display:flex;gap:14px;align-items:center">
        <div class="vizcol"><svg class="ring" id="mm-ca" width="84" height="84" viewBox="0 0 84 84"></svg><div class="cbcap">cb_a</div></div>
        <div class="vizcol"><svg class="ring" id="mm-cb" width="84" height="84" viewBox="0 0 84 84"></svg><div class="cbcap">cb_b</div></div>
      </div>
      <div class="accbox" id="mm-acc"></div>
      <div class="holder" id="mm-holder">DST: free</div>
      <div><div class="striplbl">C · Mt×Nt output</div><div class="mmgrid" id="mm-c" style="grid-template-columns:repeat(2,30px)"></div></div>
    </div>
    <div class="pane violetside" id="mm-cp"></div>
  </div>
  <div class="trapcards">
    <div class="trap"><b>trap 1 · pack inside the K loop</b><br>
      Packing writes to a bfloat16 CB — 7 mantissa bits. Round the partial sum on every step of a
      Kt=64 reduction and the result is mush; the symptom is <em>results that drift as Kt grows</em>.
      Keep the sum in DST and pack <b>once, after the loop</b>.</div>
    <div class="trap"><b>trap 2 · SrcOrder::Reverse</b>
      <pre>compute_kernel_hw_startup&lt;SrcOrder::Reverse&gt;(cb_a, cb_b, cb_out);
matmul_init(cb_a, cb_b);   // NOT binary_op_init_common</pre>
      Matmul is the one op where in0 → SrcB and in1 → SrcA. Use the default
      <code>Regular</code> and you get a plausible-looking <em>wrong</em> matrix — no error.
      Two lines that cost people an afternoon.</div>
  </div>
  <p class="src-note">exercises/06_matmul/solution/{reader,compute}.cpp — trimmed loop bodies · theory/06-compute.md — “Matmul, and its two traps”</p>
</div>`},

{t:"Lesson 07 — reuse & the fidelity surprise", h:`
<div class="wrap">
  <p class="eyebrow">06 · lesson 07 · matmul at scale</p>
  <h2>Reuse A's row, parallelise by rows — then the surprise</h2>
  <p class="lede">Lesson 06 reads <code>2·Mt·Nt·Kt</code> tiles to touch <code>Mt·Kt + Kt·Nt</code>
  of data — at 64×64×8 that is <b>65536 reads for 1024 tiles: 64× redundant</b>. The fix costs one
  moved line: keep A's row resident (<code>cb_wait_front(cb_a, Kt)</code> once, pop <em>after</em>
  the column loop) and stream only B. Then give each core a range of rows. Step the same tiny
  <b>Mt=2, Kt=3, Nt=2</b> problem as lesson 06 and watch the A counters: they stop at 1.</p>
  <div class="simbar">
    <button class="ctl primary" id="m7-step">⏵ step</button>
    <button class="ctl" id="m7-play">▶ play</button>
    <button class="ctl" id="m7-reset">↺ reset</button>
    <span class="sp"></span>
    <span class="tickbox" id="m7-reads"></span>
    <span class="tickbox">cycle <b id="m7-tick">0</b></span>
  </div>
  <div class="hangbar" id="m7-hang"></div>
  <div class="donebar" id="m7-done"></div>
  <div class="simgrid">
    <div class="pane" id="m7-rp"></div>
    <div class="vizcol">
      <div style="display:flex;gap:22px;align-items:flex-start;justify-content:center">
        <div><div class="striplbl">A · Mt×Kt (reads)</div><div class="mmgrid" id="m7-a" style="grid-template-columns:repeat(3,30px)"></div></div>
        <div><div class="striplbl">B · Kt×Nt (reads)</div><div class="mmgrid" id="m7-b" style="grid-template-columns:repeat(2,30px)"></div></div>
      </div>
      <div style="display:flex;gap:14px;align-items:center">
        <div class="vizcol"><svg class="ring" id="m7-ca" width="84" height="84" viewBox="0 0 84 84"></svg><div class="cbcap" id="m7-calbl">cb_a · Kt pages</div></div>
        <div class="vizcol"><svg class="ring" id="m7-cb" width="84" height="84" viewBox="0 0 84 84"></svg><div class="cbcap">cb_b · 2·Kt pages</div></div>
        <div class="vizcol"><svg class="ring vio" id="m7-cout" width="84" height="84" viewBox="0 0 84 84"></svg><div class="cbcap">cb_out · to writer</div></div>
      </div>
      <div><div class="striplbl">DST registers (8 usable — 1 accumulator)</div><div class="dstslots" id="m7-dst8"></div></div>
      <div class="accbox" id="m7-acc"></div>
      <div class="holder" id="m7-holder">DST: free</div>
      <div><div class="striplbl">C · Mt×Nt output</div><div class="mmgrid" id="m7-c" style="grid-template-columns:repeat(2,30px)"></div></div>
    </div>
    <div class="pane violetside" id="m7-cp"></div>
  </div>
  <div class="twocol" style="margin-top:20px">
    <div>
      <p style="color:var(--muted);font-size:13.5px;margin:0">Traffic drops from
      <code>2·Mt·Nt·Kt</code> to <code>Mt·Kt + Mt·Nt·Kt</code> — B is still re-read per row;
      lesson 08 fixes that dimension too. On silicon at Mt=64, Kt=8, Nt=32, this kernel plus
      row-parallelism goes <b>2025 µs at 1 core → 201 µs / 193 GB/s at 32 cores</b> — right back
      onto the DRAM ceiling, which sets up the surprise on the right.</p>
    </div>
    <div>
      <div class="panelbox">
        <div class="striplbl" style="text-align:left">the surprise · fidelity sweep at 64 cores</div>
        <table class="opstable" style="margin-top:6px">
          <tr><th>fidelity</th><th>math passes</th><th>measured time</th></tr>
          <tr><td><code>HiFi4</code></td><td class="num">4</td><td class="num">207 µs</td></tr>
          <tr><td><code>HiFi2</code></td><td class="num">2</td><td class="num">209 µs</td></tr>
          <tr><td><code>LoFi</code></td><td class="num">1</td><td class="num">208 µs</td></tr>
        </table>
        <p style="color:var(--muted);font-size:13px;margin:10px 0 0">A <b class="r">4× cut in math
        work bought nothing</b> — all three within 1%, at 1 core and at 64. The kernel sits on the
        DRAM ceiling (or on its own serial data movement); the multiplier is idle either way.
        <b style="color:var(--text)">The FPU was never what you were waiting on.</b></p>
      </div>
    </div>
  </div>
  <p class="src-note">exercises/07_matmul_tuned/README.md — “Reading the benchmark” · solution/compute.cpp — the no-pop window · theory/01 §7: “reducing the math work 4× changes the runtime by 1%”</p>
</div>`},

{t:"Lesson 08 — one read, Mb outputs", h:`
<div class="wrap">
  <p class="eyebrow">07 · lesson 08 · the mechanism, animated</p>
  <h2>Hold Mb rows of A — one read of B feeds Mb outputs</h2>
  <p class="lede">Lesson 07's reuse was one-dimensional: the resident A row served Nt columns, but
  every B column fed <em>one</em> output tile and was dropped. Output blocking holds <b>Mb rows of
  A</b> in L1 and keeps <b>Mb accumulators</b> live in DST — each read of B's column lands in Mb
  outputs at once. Race the two strategies on the same matmul (<b>Mt=4, Kt=3, Nt=2</b>):
  <b style="color:var(--text)">every step is one trip to DRAM</b>, and the bars keep score.</p>
  <div class="simbar">
    <button class="ctl primary" id="m8-step">⏵ step</button>
    <button class="ctl" id="m8-play">▶ play</button>
    <button class="ctl" id="m8-reset">↺ reset</button>
    <span class="optgrp">right lane Mb
      <button data-r8="2">2</button><button data-r8="4" class="on">4</button>
    </span>
    <span class="sp"></span>
    <span class="tickbox">step <b id="m8-tick">0</b></span>
  </div>
  <div class="donebar" id="m8-done"></div>
  <div class="racegrid">
    <div class="panelbox lane" id="m8-l0"></div>
    <div class="panelbox lane" id="m8-l1"></div>
  </div>
  <div class="twocol" style="margin-top:20px">
    <div>
      <pre class="code" style="border:1px solid var(--line);border-radius:8px"><div class="cl">tile_regs_acquire();          // Mb accumulators: DST[0..Mb)</div><div class="cl">for (uint32_t m = 0; m &lt; Mb; m++)</div><div class="cl">  for (uint32_t kt = 0; kt &lt; Kt; kt++)</div><div class="cl cl-mark">    matmul_tiles(cb_a, cb_b, m*Kt + kt, kt, m);</div><div class="cl cl-mark">    // A: window m·Kt+kt · B: kt — SHARED · DST: slot m</div><div class="cl">tile_regs_commit();  // Mb tiles out; writer scatters them Nt apart</div></pre>
    </div>
    <div>
      <p style="color:var(--muted);font-size:13.5px;margin:0">The price: Mb trades <b>parallelism
      for intensity</b>. Row-blocks are the independent work items — the right lane finished in a
      fraction of the reads but had 1 block where the left had 4. At Mt=128, Mb=8 leaves 16 blocks
      → a 16-core cap. <code>cb_a</code> must hold Mb·Kt tiles of L1, and the 8 DST slots cap Mb
      at 8. The measured sweep is next — and it ends somewhere unexpected.</p>
    </div>
  </div>
  <p class="src-note">exercises/08_output_blocking/solution/compute.cpp — the m loop · README.md — traffic: A Mt·Kt + B (Mt/Mb)·Nt·Kt</p>
</div>`},

{t:"Lesson 08 — the measured sweep", h:`
<div class="wrap">
  <p class="eyebrow">08 · lesson 08 · the measured sweep</p>
  <h2>Sweep Mb and watch which number stops moving</h2>
  <p class="lede">That was the mechanism — here is what it buys on silicon. Each doubling of Mb
  halves B's traffic (one DST accumulator per row — DST caps Mb at 8). Sweep Mb and watch
  <em>which number stops moving</em> — measured at Mt=128, Kt=8, Nt=32, 16 cores:</p>
  <div class="simbar">
    <span class="optgrp">Mb (rows per block)
      <button data-mb="1" class="on">1</button><button data-mb="2">2</button>
      <button data-mb="4">4</button><button data-mb="8">8</button>
    </span>
    <span class="sp"></span>
    <span class="regime" id="t8-status"></span>
  </div>
  <div class="simgrid3" style="grid-template-columns:auto 1fr 1fr;gap:26px">
    <div>
      <div class="mbdiag" id="t8-diag"></div>
      <pre class="code" style="border:1px solid var(--line);border-radius:8px;margin-top:12px"><div class="cl">tile_regs_acquire();</div><div class="cl">for (uint32_t m = 0; m &lt; Mb; m++)</div><div class="cl">  for (uint32_t kt = 0; kt &lt; Kt; kt++)</div><div class="cl cl-mark">    matmul_tiles(cb_a, cb_b,</div><div class="cl cl-mark">        m * Kt + kt, kt, m); // B idx kt: SHARED</div><div class="cl">tile_regs_commit();</div></pre>
      <p style="color:var(--muted);font-size:12.5px;max-width:36ch;margin-top:8px">The cost:
      Mb trades <b>parallelism for intensity</b> — Mt/Mb work items, so Mb=8 on Mt=128 caps you

    </div>
    <div>
      <svg class="chart" id="t8-chartbw" role="img" aria-label="bandwidth vs Mb"></svg>
      <div class="chartcap">bandwidth · dashed = ~195 GB/s ceiling</div>
      <svg class="chart" id="t8-chartt" role="img" aria-label="time vs Mb" style="margin-top:10px"></svg>
      <div class="chartcap">device time</div>
    </div>
    <div>
      <div class="statrow" style="flex-direction:column;align-items:flex-start;gap:14px">
        <span class="stat"><span class="k">device time</span><span class="v" id="t8-time"></span><span class="u">µs</span></span>
        <span class="stat"><span class="k">DRAM traffic</span><span class="v" id="t8-traffic"></span><span class="u">MiB</span></span>
        <span class="stat"><span class="k">bandwidth</span><span class="v" id="t8-bw"></span><span class="u">GB/s</span></span>

/* ============================== CB model ============================== */
function newCB(cap){return {capacity:cap,
  pages:Array.from({length:cap},()=>({state:"free",tile:null})),
  rd:0, wrRes:0, wrPush:0, free:cap, visible:0, pushed:0, popped:0};}
const pageAt=(cb,i)=>cb.pages[((i%cb.capacity)+cb.capacity)%cb.capacity];

function cbReserve(cb,n){
  if(n>cb.capacity) return {blocked:"cb_reserve_back("+n+") can NEVER succeed — the CB only has "+cb.capacity+" pages"};
  if(cb.free<n) return {blocked:"cb_reserve_back — need "+n+" free, have "+cb.free};
  for(let k=0;k<n;k++) pageAt(cb,cb.wrRes+k).state="reserved";
  cb.wrRes+=n; cb.free-=n; return null;
}
function cbPush(cb,n){
  for(let k=0;k<n;k++) pageAt(cb,cb.wrPush+k).state="ready";
  cb.wrPush+=n; cb.visible+=n; cb.pushed+=n; return null;
}
function cbWait(cb,n){
  if(n>cb.capacity) return {blocked:"cb_wait_front("+n+") can NEVER succeed — the CB only has "+cb.capacity+" pages"};
  if(cb.visible<n) return {blocked:"cb_wait_front — need "+n+" visible, have "+cb.visible};
  return null;
}
function cbPop(cb,n){
  for(let k=0;k<n;k++){const p=pageAt(cb,cb.rd+k); p.state="free"; p.tile=null;}
  cb.rd+=n; cb.visible-=n; cb.free+=n; cb.popped+=n; return null;
}

/* ============================== sim engine ============================== */
/* Same engine as the circular-buffer deck, extended with an optional
   state.tickHook() called once per tick — used to model NoC latency, so
   overlapped reads genuinely arrive later than they were issued. */
const allSims=[];
class Sim{
  constructor(id,build,render){this.id=id;this.buildFn=build;this.renderFn=render;this.timer=null;allSims.push(this);this.reset();}
  reset(){this.stopPlay();const s=this.buildFn();this.kernels=s.kernels;this.state=s;this.tick=0;this.stall=0;this.hang=false;this.render();}
  get running(){return this.kernels.some(k=>!k.done);}
  step(){
    if(this.hang||!this.running) return;
    if(this.state.tickHook) this.state.tickHook();
    let progressed=false;
    for(const k of this.kernels){
      if(k.done) continue;
      const ins=k.program[k.pc];
      const r=ins.run(k,this.state)||{};
      if(r.blocked){k.blocked=r.blocked;}
      else{k.blocked=null;progressed=true;if(!r.stay&&!r.jumped&&!k.done)k.pc++;}
    }
    this.tick++;
    if(!progressed){this.stall++;if(this.stall>=6){this.hang=true;this.stopPlay();}}
    else this.stall=0;
    if(!this.running){this.stopPlay();if(this.onDone)this.onDone(this);}
    this.render();
  }
  render(){this.renderFn(this);}
  playToggle(){
    if(this.timer){this.stopPlay();}
    else{
      if(this.hang||!this.running) this.reset();
      this.timer=setInterval(()=>{this.step();if(this.hang||!this.running)this.stopPlay();},420);
      if(this.playBtn)this.playBtn.textContent="⏸ pause";
    }
  }
  stopPlay(){if(this.timer){clearInterval(this.timer);this.timer=null;}if(this.playBtn)this.playBtn.textContent="▶ play";}
}
function wireSim(sim,prefix){
  $(prefix+"-step").onclick=()=>{sim.stopPlay();sim.step();};
  sim.playBtn=$(prefix+"-play");
  sim.playBtn.onclick=()=>sim.playToggle();
  $(prefix+"-reset").onclick=()=>sim.reset();
}

/* ============================== render helpers ============================== */
function paneHTML(k){
  const cur=(!k.done)?k.program[k.pc].line:-1;
  const lines=k.lines.map((ln,idx)=>{
    let cls="cl";
    if(idx===cur) cls+=k.blocked?" cl-blk":" cl-cur";
    return '<div class="'+cls+'">'+(esc(ln)||" ")+"</div>";
  }).join("");
  const st=k.done?'<span class="st-done">✓ kernel_main returned</span>'

  return '<div class="pane-hd"><span class="kname">'+k.name+'</span><span class="proc proc-'+k.color+'">'+k.proc+'</span></div>'
    +'<pre class="code">'+lines+'</pre><div class="pane-ft">'+st+"</div>";
}
function staticPane(el,name,proc,color,lines,marks){
  const mk=marks||[];

}
function pol(cx,cy,r,aDeg){const a=aDeg*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arcPath(cx,cy,r0,r1,a0,a1){
  const [x0,y0]=pol(cx,cy,r1,a0),[x1,y1]=pol(cx,cy,r1,a1),
        [x2,y2]=pol(cx,cy,r0,a1),[x3,y3]=pol(cx,cy,r0,a0);
  const lg=(a1-a0)>180?1:0;
  return "M"+x0.toFixed(1)+" "+y0.toFixed(1)+" A"+r1+" "+r1+" 0 "+lg+" 1 "+x1.toFixed(1)+" "+y1.toFixed(1)
    +" L"+x2.toFixed(1)+" "+y2.toFixed(1)+" A"+r0+" "+r0+" 0 "+lg+" 0 "+x3.toFixed(1)+" "+y3.toFixed(1)+" Z";
}
function drawRing(svgId,cb,opts){
  const svg=(typeof svgId==="string")?$(svgId):svgId; if(!svg) return;
  const o=opts||{};
  const size=svg.viewBox.baseVal.width||parseFloat(svg.getAttribute("width"));
  const showPtr=!o.noPtr&&cb.capacity>1&&size>=160;
  const cx=size/2,cy=size/2,r1=size/2-(showPtr?16:4),r0=r1*0.58;
  const cap=cb.capacity;let out="";
  if(cap===1){
    const p=cb.pages[0];
    out+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((r0+r1)/2)+'" fill="none" stroke-width="'+(r1-r0)+'" class="pg pg-'+p.state+'" style="fill:none"/>';
    if(p.tile!==null){const [tx,ty]=pol(cx,cy,(r0+r1)/2,-90);out+='<text x="'+tx+'" y="'+ty+'" class="pgt">'+p.tile+"</text>";}
  }else{
    const gap=Math.min(5,360/cap*0.06);
    for(let i=0;i<cap;i++){
      const a0=-90+i*360/cap+gap,a1=-90+(i+1)*360/cap-gap;
      const p=cb.pages[i];
      out+='<path d="'+arcPath(cx,cy,r0,r1,a0,a1)+'" class="pg pg-'+p.state+'"/>';
      const am=(a0+a1)/2,[tx,ty]=pol(cx,cy,(r0+r1)/2,am);
      const lbl=p.tile!==null?p.tile:(p.state==="free"?"":"·");
      const tcls=(p.state==="ready"||p.state==="draining")?"pgt":"pgt pg-free-t";
      if(lbl!=="")out+='<text x="'+tx.toFixed(1)+'" y="'+ty.toFixed(1)+'" class="'+tcls+'">'+lbl+"</text>";
    }
    if(showPtr){
      const slotMid=idx=>-90+((((idx%cap)+cap)%cap)+0.5)*360/cap;
      const wAng=slotMid(cb.wrRes),rAng=slotMid(cb.rd);
      const [wlx,wly]=pol(cx,cy,r1+9,wAng);
      const [rlx,rly]=pol(cx,cy,Math.max(r0-11,10),rAng);
      out+='<text x="'+wlx.toFixed(1)+'" y="'+wly.toFixed(1)+'" class="ptr ptr-wr">W▸</text>'
         +'<text x="'+rlx.toFixed(1)+'" y="'+rly.toFixed(1)+'" class="ptr ptr-rd">R</text>';
    }
  }
  if(!o.noCenter&&size>=100){
    out+='<text x="'+cx+'" y="'+(cy-3)+'" class="ctr-n">'+cb.visible+"/"+cap+"</text>"
       +'<text x="'+cx+'" y="'+(cy+13)+'" class="ctr-l">visible</text>';
  }
  svg.innerHTML=out;
}
function stripHTML(arr,vio){
  return arr.map((c,i)=>{
    let cls="tile t-"+c.state; if(vio&&c.state==="written")cls+=" vio";
    let lbl=(c.val!==undefined&&c.val!==null)?c.val:(c.state==="empty"?"·":i);
    return '<div class="'+cls+'" title="tile '+i+'">'+lbl+"</div>";
  }).join("");
}
function hangHTML(where){
  return "<b>⚠ device hang</b> — every processor is blocked and no push/pop can ever unblock them. "
    +"In the dojo this test fails after 30 s with “device hang”. "+(where||"");
}

/* ============================== chart helper ============================== */
function fmtNum(v){return v>=100?String(Math.round(v)):String(Math.round(v*10)/10);}
function lineChart(svg,xs,ys,o){
  o=o||{};
  const W=o.w||380,H=o.h||210,padL=46,padR=14,padT=16,padB=30;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  const ymax=o.ymax||Math.max(...ys,o.ceiling||0)*1.14;
  const X=i=>padL+(W-padL-padR)*(xs.length===1?0.5:i/(xs.length-1));
  const Y=v=>H-padB-(H-padT-padB)*(v/ymax);
  let out="";
  for(let g=0;g<=4;g++){
    const v=ymax*g/4,y=Y(v);
    out+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)
      +'" stroke="var(--line)" stroke-width="1"'+(g?' stroke-dasharray="2 4"':"")+"/>"
      +'<text x="'+(padL-6)+'" y="'+(y+3).toFixed(1)+'" class="axt" text-anchor="end">'+fmtNum(v)+"</text>";
  }
  if(o.ceiling){
    const y=Y(o.ceiling);
    out+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)
      +'" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="6 4"/>'
      +'<text x="'+(W-padR)+'" y="'+(y-5).toFixed(1)+'" class="axt" text-anchor="end" style="fill:var(--red)">'+(o.ceilLabel||"")+"</text>";
  }
  xs.forEach((x,i)=>{out+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" class="axt" text-anchor="middle">'+x+"</text>";});
  if(o.xlab)out+='<text x="'+((padL+W-padR)/2).toFixed(1)+'" y="'+(H-8)+'" class="axt" text-anchor="middle" dx="0" dy="0"></text>';
  const col=o.color||"var(--teal)";
  out+='<path d="'+ys.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ")+'" fill="none" stroke="'+col+'" stroke-width="2"/>';
  ys.forEach((v,i)=>{
    const sel=i===o.sel;
    out+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(sel?6:3.5)+'" fill="'+col+'"'
      +(sel?' stroke="var(--text)" stroke-width="1.5"':"")+"/>";
    if(o.labels&&o.labels[i]!=null)
      out+='<text x="'+X(i).toFixed(1)+'" y="'+(Y(v)-10).toFixed(1)+'" class="'+(sel?"axt2":"axt")+'" text-anchor="middle">'+o.labels[i]+"</text>";
  });
  svg.innerHTML=out;
}

const L05_N=8,L05_LAT=3;let l05block=1;const l05res={};

    }

    status:k=>"i = "+k.i,

"    cb_reserve_back(cb_a, block);",
"    cb_reserve_back(cb_b, block);",
"    const uint32_t base_a = get_write_ptr(cb_a); // once",
"    const uint32_t base_b = get_write_ptr(cb_b);",
"    for (uint32_t t = 0; t < block; t++) {",
"        noc_async_read_page(i + t, a, base_a + t * tile_bytes);",
"        noc_async_read_page(i + t, b, base_b + t * tile_bytes);",
"    }",
"    noc_async_read_barrier(); // ONE wait, 2×block in flight",
"    cb_push_back(cb_a, block);",
"    cb_push_back(cb_b, block);",
"}"],
    program:[
      {line:1,run:()=>cbReserve(cba,B)},
      {line:2,run:()=>cbReserve(cbb,B)},
      {line:3,run:k=>{k.t=0;return null;}},

      {line:9,run:()=>noc.reads.length?{blocked:"read barrier — "+noc.reads.length+" read(s) still in flight"}:null},
      {line:10,run:()=>cbPush(cba,B)},
      {line:11,run:()=>cbPush(cbb,B)},
      {line:0,run:k=>{k.i+=B;if(k.i<L05_N){k.pc=0;return{jumped:true};}k.done=true;return{jumped:true};}}
    ]};
  const compute={name:"compute.cpp",proc:"TRISC 0·1·2",color:"violet",i:0,t:0,pc:0,done:false,blocked:null,
    status:k=>"i = "+k.i,
    lines:[
"for (uint32_t i = 0; i < n_tiles; i += block) {",
"    cb_wait_front(cb_a, block);",
"    cb_wait_front(cb_b, block);",
"    cb_reserve_back(cb_out, block);",
"    tile_regs_acquire();  // ONE handshake per block",
"    for (uint32_t t = 0; t < block; t++)",
"        add_tiles(cb_a, cb_b, t, t, t); // CB idx t, DST slot t",
"    tile_regs_commit();",
"    tile_regs_wait();",
"    for (uint32_t t = 0; t < block; t++)",
"        pack_tile(t, cb_out);",
"    tile_regs_release();",
"    cb_push_back(cb_out, block);",
"    cb_pop_front(cb_a, block);",
"    cb_pop_front(cb_b, block);",
"}"],
    program:[
      {line:1,run:()=>cbWait(cba,B)},
      {line:2,run:()=>cbWait(cbb,B)},
      {line:3,run:()=>cbReserve(cbout,B)},
      {line:4,run:k=>{dstRegs.holder="math";dstRegs.slots=Array.from({length:8},()=>null);k.t=0;return null;}},
      {line:6,run:k=>{dstRegs.slots[k.t]={t:k.i+k.t};k.t++;return k.t<B?{stay:true}:null;}},
      {line:7,run:()=>{dstRegs.holder="committed";return null;}},
      {line:8,run:k=>{dstRegs.holder="pack";k.t=0;return null;}},

      {line:12,run:()=>cbPush(cbout,B)},
      {line:13,run:()=>cbPop(cba,B)},
      {line:14,run:()=>cbPop(cbb,B)},
      {line:0,run:k=>{k.i+=B;if(k.i<L05_N){k.pc=0;return{jumped:true};}k.done=true;return{jumped:true};}}
    ]};
  const writer={name:"writer.cpp (provided)",proc:"BRISC",color:"amber",i:0,t:0,pc:0,done:false,blocked:null,
    status:k=>"i = "+k.i,
    lines:[
"for (uint32_t i = start; i < end; i += block) {",
"    cb_wait_front(cb_in, block);",
"    const uint32_t base = get_read_ptr(cb_in);",
"    for (uint32_t t = 0; t < block; t++)",
"        noc_async_write_page(i + t, dst, base + t * tile_bytes);",

      {line:1,run:()=>cbWait(cbout,B)},

        k.t++;return k.t<B?{stay:true}:null;}},
      {line:5,run:()=>noc.writes.length?{blocked:"write barrier — "+noc.writes.length+" write(s) still in flight"}:null},
      {line:6,run:()=>cbPop(cbout,B)},

      {line:2,run:k=>{k.nt++;if(k.nt<Nt){k.pc=1;return{jumped:true};}k.nt=0;return null;}},
      {line:15,run:()=>cbPop(cba,Kt)},
      {line:0,run:k=>{k.mt++;if(k.mt<Mt){k.pc=0;return{jumped:true};}k.done=true;return{jumped:true};}}
    ]};
  st.kernels=[reader,compute];
  return st;
}
function renderM7(sim){
  const s=sim.state,{Mt,Kt,Nt}=MM;
  $("m7-rp").innerHTML=paneHTML(sim.kernels[0]);
  $("m7-cp").innerHTML=paneHTML(sim.kernels[1]);
  drawRing("m7-ca",s.cba,{noCenter:true,noPtr:true});
  drawRing("m7-cb",s.cbb,{noCenter:true,noPtr:true});
  drawRing("m7-cout",s.cbout,{noCenter:true,noPtr:true});
  $("m7-calbl").textContent=s.cba.visible===Kt?"cb_a · row "+sim.kernels[1].mt+" resident":"cb_a · Kt pages";
  $("m7-a").innerHTML=s.aT.map((t,i)=>
    '<div class="tile '+(i===s.lastA?"t-reading":t.count?"t-read":"t-empty")+'" title="A tile '+i+", read "+t.count+' times">'+(t.count||"·")+"</div>").join("");
  $("m7-b").innerHTML=s.bT.map((t,i)=>
    '<div class="tile '+(i===s.lastB?"t-reading":t.count?"t-read":"t-empty")+'" title="B tile '+i+", read "+t.count+' times">'+(t.count||"·")+"</div>").join("");
  $("m7-c").innerHTML=s.cT.map(cs=>
    '<div class="tile vio '+(cs==="written"?"t-written":"t-empty")+'">'+(cs==="written"?"C":"·")+"</div>").join("");
  const a=s.acc;
  $("m7-dst8").innerHTML=Array.from({length:8},(x,i)=>{
    const on=i===0&&a.holder!=="free";
    return '<div class="dsts'+(on?" on":"")+'" title="dst['+i+']">'+(on?"Σ"+a.terms:i)+"</div>";}).join("");
  $("m7-acc").innerHTML=a.holder==="free"?"DST[0] — released"
    :"<b>DST[0]</b> = Σ<sub>k&lt;"+a.terms+"</sub> A["+a.mt+",k]·B[k,"+a.nt+"] &nbsp;·&nbsp; k = "+a.terms+"/"+Kt;
  const h=$("m7-holder");
  h.textContent={free:"DST: free",math:"DST: MATH accumulating",committed:"DST: committed",pack:"DST: PACK holds"}[a.holder];
  h.className="holder "+(a.holder==="free"?"":a.holder==="math"?"math":a.holder);
  const ar=s.aT.reduce((x,t)=>x+t.count,0),br=s.bT.reduce((x,t)=>x+t.count,0);
  $("m7-reads").innerHTML="fetched: A <b>"+ar+"</b>/"+(Mt*Kt)+" · B <b>"+br+"</b>/"+(Kt*Nt)
    +' <span style="color:var(--faint)">(lesson 06: 12 · 12)</span>';
  $("m7-tick").textContent=sim.tick;
  $("m7-hang").className="hangbar"+(sim.hang?" on":"");

  if(ok)$("m7-done").innerHTML="✓ same C from <b>"+(ar+br)+"</b> reads instead of lesson 06's 24: every A tile "
    +"crossed the NoC exactly once (all counters 1), while B is still re-read once per row ("+(br/(Kt*Nt))
    +"×). At Mt=64, Kt=8, Nt=32 that is 32768 → 16896 tile-reads; the measured curve below adds row-parallelism "
    +"on top. B's per-row redundancy is what lesson 08 removes.";
}
const m7=new Sim("m7",buildM7,renderM7);

/* ============================== slide 7 · lesson 08 race ============================== */
/* Two lanes, same matmul, shared clock. One step = one trip to DRAM:
   either an A block-load or a B column-read (which lands in Mb outputs). */
const R8={Mt:4,Kt:3,Nt:2};let r8mb=4;
function r8Lane(Mb){
  const {Mt,Kt,Nt}=R8,NB=Mt/Mb,ev=[];
  for(let blk=0;blk<NB;blk++){
    ev.push({t:"A",blk});
    for(let nt=0;nt<Nt;nt++)ev.push({t:"B",blk,nt});
  }
  return {Mb,NB,ev,pos:0,cur:null,
    bCount:Array.from({length:Kt*Nt},()=>0),
    cDone:Array.from({length:Mt*Nt},()=>false),
    trafA:0,trafB:0,resident:-1};
}
function r8Step(ln){
  if(ln.pos>=ln.ev.length){ln.cur=null;return;}
  const e=ln.ev[ln.pos++];ln.cur=e;
  if(e.t==="A"){ln.resident=e.blk;ln.trafA+=ln.Mb*R8.Kt;}
  else{
    ln.trafB+=R8.Kt;
    for(let k=0;k<R8.Kt;k++)ln.bCount[k*R8.Nt+e.nt]++;
    for(let m=0;m<ln.Mb;m++)ln.cDone[(e.blk*ln.Mb+m)*R8.Nt+e.nt]=true;
  }
}
function r8SVG(ln){
  const {Mt,Kt,Nt}=R8,T=24,P=28;
  const ax=10,by=16,bx=ax+Kt*P+18,ay=by+Kt*P+22,cx=bx,cy=ay;
  let s='<text x="'+(ax+(Kt*P-4)/2)+'" y="'+(ay+Mt*P+8)+'" class="axt" text-anchor="middle">A · Mt×Kt</text>'
       +'<text x="'+(bx+(Nt*P-4)/2)+'" y="'+(by-6)+'" class="axt" text-anchor="middle">B · Kt×Nt (reads)</text>'
       +'<text x="'+(cx+(Nt*P-4)/2)+'" y="'+(cy+Mt*P+8)+'" class="axt" text-anchor="middle">C</text>'
       +'<text x="'+(ax+Kt*P+3)+'" y="'+(ay+Mt*P/2)+'" class="axt" text-anchor="middle">×</text>';
  const blk=ln.resident;
  for(let r=0;r<Mt;r++)for(let c=0;c<Kt;c++){
    const x=ax+c*P,y=ay+r*P;
    const inRes=blk>=0&&r>=blk*ln.Mb&&r<(blk+1)*ln.Mb;
    const past=blk>=0&&r<blk*ln.Mb;
    const f=inRes?"color-mix(in srgb,var(--amber) 38%,var(--panel2))":"var(--panel2)";
    const str=inRes?"var(--amber)":past?"color-mix(in srgb,var(--amber) 45%,var(--line))":"var(--line)";
    s+='<rect x="'+x+'" y="'+y+'" width="'+T+'" height="'+T+'" rx="5" fill="'+f+'" stroke="'+str+'"/>';
  }
  if(blk>=0){
    const fy=ay+blk*ln.Mb*P-4;
    s+='<rect x="'+(ax-5)+'" y="'+fy+'" width="'+(Kt*P-4+10)+'" height="'+(ln.Mb*P-4+8)+'" rx="7" fill="none" stroke="var(--amber)" stroke-dasharray="5 4" stroke-width="1.5"/>'
      +'<text x="'+(ax-5)+'" y="'+(fy-4)+'" class="axt" style="fill:var(--amber)">cb_a · L1</text>';
  }
  for(let r=0;r<Kt;r++)for(let c=0;c<Nt;c++){
    const x=bx+c*P,y=by+r*P,n=ln.bCount[r*Nt+c];
    const f=n?"color-mix(in srgb,var(--teal) "+Math.min(15+n*15,60)+"%,var(--panel2))":"var(--panel2)";
    s+='<rect x="'+x+'" y="'+y+'" width="'+T+'" height="'+T+'" rx="5" fill="'+f+'" stroke="'+(n?"var(--teal)":"var(--line)")+'"/>'
      +'<text x="'+(x+T/2)+'" y="'+(y+T/2+1)+'" class="bcnt" text-anchor="middle" dominant-baseline="central">'+(n||"·")+"</text>";
  }
  for(let r=0;r<Mt;r++)for(let c=0;c<Nt;c++){
    const x=cx+c*P,y=cy+r*P;
    s+=ln.cDone[r*Nt+c]
      ?'<rect x="'+x+'" y="'+y+'" width="'+T+'" height="'+T+'" rx="5" fill="var(--violet)" stroke="var(--violet)"/>'
      :'<rect x="'+x+'" y="'+y+'" width="'+T+'" height="'+T+'" rx="5" fill="none" stroke="var(--line)" stroke-dasharray="3 3"/>';
  }
  if(ln.cur&&ln.cur.t==="A"){
    s+='<rect class="band" x="'+(ax-3)+'" y="'+(ay+ln.cur.blk*ln.Mb*P-3)+'" width="'+(Kt*P-4+6)+'" height="'+(ln.Mb*P-4+6)+'" rx="6" fill="color-mix(in srgb,var(--amber) 22%,transparent)" stroke="var(--amber)"/>';
  }
  if(ln.cur&&ln.cur.t==="B"){
    const nt=ln.cur.nt,b2=ln.cur.blk;
    s+='<rect class="band" x="'+(bx+nt*P-3)+'" y="'+(by-3)+'" width="'+(T+6)+'" height="'+((cy+Mt*P-4+3)-(by-3))+'" rx="6" fill="color-mix(in srgb,var(--teal) 20%,transparent)" stroke="var(--teal)"/>';
    for(let m=0;m<ln.Mb;m++){
      const row=b2*ln.Mb+m;
      s+='<rect class="band" x="'+(ax-3)+'" y="'+(ay+row*P-3)+'" width="'+((cx+Nt*P-4+3)-(ax-3))+'" height="'+(T+6)+'" rx="6" fill="color-mix(in srgb,var(--amber) 16%,transparent)" stroke="var(--amber)"/>'
        +'<rect x="'+(cx+nt*P-2)+'" y="'+(cy+row*P-2)+'" width="'+(T+4)+'" height="'+(T+4)+'" rx="6" fill="none" stroke="var(--violet)" stroke-width="2"/>';
    }
  }
  return s;
}
function r8LaneHTML(ln,head,MAX){
  const tot=ln.trafA+ln.trafB;
  const dst=Array.from({length:8},(x,i)=>{
    const on=ln.cur&&ln.cur.t==="B"&&i<ln.Mb;
    return '<div class="dsts'+(on?" on":"")+'" title="dst['+i+']">'+(on?"m"+i:i)+"</div>";}).join("");
  let st;
  if(ln.cur)st=ln.cur.t==="A"
    ?"load A block "+(ln.cur.blk+1)+"/"+ln.NB+" → cb_a ("+(ln.Mb*R8.Kt)+" tiles)"
    :"read B col "+ln.cur.nt+" ONCE → <b>"+ln.Mb+"</b> output tile"+(ln.Mb>1?"s":"");
  else if(ln.pos>=ln.ev.length&&ln.pos>0)st='<span class="done">✓ C complete · '+tot+" DRAM reads</span>";
  else st="ready";
  return '<div class="lanehd">'+head+'</div>'
    +'<svg width="190" viewBox="0 0 174 250" class="chart" role="img" aria-label="blocked matmul dataflow">'+r8SVG(ln)+"</svg>"
    +'<div class="striplbl">DST · '+ln.Mb+" accumulator"+(ln.Mb>1?"s":"")+" of 8</div>"
    +'<div class="dstslots">'+dst+"</div>"
    +'<div class="tmeter"><span class="tm tm-a" style="width:'+(ln.trafA/MAX*100).toFixed(1)+'%"></span><span class="tm tm-b" style="width:'+(ln.trafB/MAX*100).toFixed(1)+'%"></span></div>'
    +'<div class="tm-lbl">DRAM reads <b>'+tot+'</b> · <span class="a">A '+ln.trafA+'</span> · <span class="t">B '+ln.trafB+"</span></div>"
    +'<div class="lanest">'+st+"</div>";
}
function renderR8(r){
  const MAX=R8.Mt*R8.Kt+R8.Mt*R8.Nt*R8.Kt;
  const l1=r.lanes[1];
  const heads=["<b>Mb = 1</b> · lesson 07 · "+R8.Mt+" row-blocks",
    "<b>Mb = "+l1.Mb+"</b> · output blocking · "+l1.NB+" row-block"+(l1.NB>1?"s":"")];
  r.lanes.forEach((ln,i)=>{$("m8-l"+i).innerHTML=r8LaneHTML(ln,heads[i],MAX);});
  $("m8-tick").textContent=r.tick;
  const done=!r.running&&r.tick>0;
  $("m8-done").className="donebar"+(done?" on":"");
  if(done)$("m8-done").innerHTML="✓ identical C, identical A traffic ("+r.lanes[0].trafA
    +" tiles) — but B: <b>"+r.lanes[0].trafB+"</b> vs <b>"+l1.trafB+"</b> tile-reads, ÷Mb exactly. "
    +"On silicon (Mt=128, Kt=8, Nt=32) Mb 1 → 8 cuts measured traffic 74 → 18 MiB… yet time only "
    +"falls 394 → 160 µs — traffic ÷4.1, time ÷2.5. <b>Traffic is not time</b> — the sweep on the "
    +"next slide shows the bottleneck moving.";
}
const r8={lanes:[r8Lane(1),r8Lane(r8mb)],tick:0,timer:null,playBtn:null,
  get running(){return this.lanes.some(l=>l.pos<l.ev.length);},
  reset(){this.stopPlay();this.lanes=[r8Lane(1),r8Lane(r8mb)];this.tick=0;this.render();},
  step(){if(!this.running)return;this.lanes.forEach(l=>r8Step(l));this.tick++;
    if(!this.running)this.stopPlay();this.render();},
  playToggle(){if(this.timer)this.stopPlay();
    else{if(!this.running)this.reset();
      this.timer=setInterval(()=>{this.step();if(!this.running)this.stopPlay();},800);
      if(this.playBtn)this.playBtn.textContent="⏸ pause";}},
  stopPlay(){if(this.timer){clearInterval(this.timer);this.timer=null;}
    if(this.playBtn)this.playBtn.textContent="▶ play";},
  render(){renderR8(this);}};
allSims.push(r8);

/* ============================== slide 8 · lesson 08 sweep ============================== */
const T8={cur:1,order:[1,2,4,8],
  data:{1:{t:394,mib:74,bw:197,tf:"5.4"},2:{t:222,mib:42,bw:198,tf:"9.7"},
        4:{t:165,mib:26,bw:165,tf:"13.0"},8:{t:160,mib:18,bw:118,tf:"13.4"}},
  notes:{1:"Lesson 07's kernel, as a baseline. Bandwidth pinned at ~197 GB/s and time tracking traffic exactly: textbook memory-bound.",
    2:"Traffic halves → time halves (394 → 222 µs), bandwidth doesn't move off the ceiling. The lever is working exactly as the theory says: halve the bytes, halve the time.",
    4:"The transition. Traffic drops 38% but time only drops 26%, and bandwidth falls OFF the ceiling to 165 GB/s. DRAM is no longer the constraint — you've stopped being able to keep it busy.",
    8:"Traffic drops another 30%… and time improves 3%. Bandwidth collapses to 118 GB/s. Halving the memory traffic bought essentially nothing: memory is no longer what you're waiting on. So what is? Next slide."}};
function t8Render(){
  const mb=T8.cur,d=T8.data[mb];
  $("t8-time").textContent=d.t;$("t8-traffic").textContent=d.mib;
  $("t8-bw").textContent=d.bw;$("t8-tput").textContent=d.tf;
  $("t8-note").textContent=T8.notes[mb];
  const stEl=$("t8-status");
  if(mb<=2){stEl.className="regime mem";stEl.textContent="memory-bound — pinned at the ceiling";}
  else if(mb===4){stEl.className="regime trans";stEl.textContent="transition — off the ceiling";}
  else{stEl.className="regime other";stEl.textContent="not memory-bound any more";}
  let rows="";
  for(let m=0;m<mb;m++)rows+='<div class="mbrow">'+'<span class="mq a"></span>'.repeat(4)+"</div>";
  let bcol="";for(let k=0;k<4;k++)bcol+='<div class="mbrow"><span class="mq b"></span></div>';
  let ccol="";for(let m=0;m<mb;m++)ccol+='<div class="mbrow"><span class="mq c"></span></div>';
  $("t8-diag").innerHTML=
    '<div class="mbcol">'+rows+'<span class="mblbl">A · Mb='+mb+" rows × Kt<br>resident in L1</span></div>"
    +'<span class="mbarrow">×</span>'
    +'<div class="mbcol">'+bcol+'<span class="mblbl">ONE read of<br>B’s column</span></div>'
    +'<span class="mbarrow">→</span>'
    +'<div class="mbcol">'+ccol+'<span class="mblbl">'+mb+" output tile"+(mb>1?"s":"")+"<br>DST slot m</span></div>";
  lineChart($("t8-chartbw"),["Mb=1","2","4","8"],T8.order.map(x=>T8.data[x].bw),
    {ceiling:195,ceilLabel:"ceiling",sel:T8.order.indexOf(mb),ymax:232,color:"var(--teal)",w:380,h:170,
     labels:T8.order.map(x=>T8.data[x].bw+"")});
  lineChart($("t8-chartt"),["Mb=1","2","4","8"],T8.order.map(x=>T8.data[x].t),
    {sel:T8.order.indexOf(mb),ymax:440,color:"var(--amber)",w:380,h:170,
     labels:T8.order.map(x=>T8.data[x].t+" µs")});
}

/* ============================== slide 8 · fidelity refutation ============================== */
const FX={mode:"naive",
  meas:{HiFi4:"159.8",HiFi2:"156.1",LoFi:"155.9"},
  naive:{HiFi4:"159.8",HiFi2:"79.9",LoFi:"40.0"},
  passes:{HiFi4:4,HiFi2:2,LoFi:1}};
function fxRender(){
  const src=FX.mode==="naive"?FX.naive:FX.meas;
  const scale=170;
  $("fx-bars").innerHTML=["HiFi4","HiFi2","LoFi"].map(f=>{
    const v=parseFloat(src[f]),pred=FX.mode==="naive"&&f!=="HiFi4";
    return '<div class="fbar"><span>'+f+" · "+FX.passes[f]+"p</span>"
      +'<div class="lane"><div class="bar" style="width:'+(v/scale*100).toFixed(1)+'%'
      +(pred?";opacity:.55;border:1px dashed var(--violet);background:color-mix(in srgb,var(--violet) 30%,transparent)":"")+'"></div></div>'
      +'<span class="tv"><b>'+src[f]+" µs</b>"+(pred?" <span style='color:var(--faint)'>(pred.)</span>":"")+"</span></div>";
  }).join("");
  $("fx-cap").innerHTML=FX.mode==="naive"
    ?"<b>Prediction, not a measurement:</b> if the kernel were FPU-bound, time would scale with mantissa passes — HiFi2 halves it, LoFi quarters it."
    :"<b>Measured</b> (Mb=8, 16 cores): 159.8 / 156.1 / 155.9 µs. A 4× cut in math passes buys ~2%. The FPU is not the limit.";
}

lineChart($("l05-chart"),["block 1","2","4","8"],[74,115,166,195],

   labels:["170 µs","109","75.8","64.6"]});
